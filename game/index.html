$('t-go').addEventListener('click',()=>{
  titleDone=true;
  $('ov-title').classList.remove('on');
  startOpening();
});

// ---------------- the opening: a letter arrives, and it IS the intake form ----
// Phase-driven rather than a single form, per the reviewed flow. Every phase is
// click-skippable so a booth operator is never trapped behind an animation.
let openPhase='', openT=0;
const OPEN_DUR={arctic:2800,house:1000,post:1200,walk:1400,letter:0,
                line1:3000,line2:2600,summary:0,leave:1600};
// Three things worth saying before the visitor leaves the house. They are
// delivered in the house panel's own chat bubble, exactly like every other
// thing CoCo says indoors, rather than as a separate captioned beat with a
// "click to carry on" prompt. Nobody should have to click their way out of a
// conversation. Each line auto-advances on a timer scaled to its own length,
// so a long claim gets long enough to actually read, and a click still skips.
// The copy lives in config (sovereignty.trust) so it is reviewable alongside
// every other scripted line rather than buried in the client.
// The stack and location are asked on the letter now, so sovereignty.trust is
// gone and its copy lives in sovereignty.summary (see buildSummary).
// The residency reply leads the sequence, so the whole beat reads as one
// continuous exchange instead of a reply followed by an advert.
let trustSeq=[], trustIdx=0;
// Long enough to read, not so long the booth stalls.
function trustDur(s){ return Math.max(3600,Math.min(9000,3000+String(s||'').length*38)); }
function openProg(){
  const d=OPEN_DUR[openPhase]||1;
  return Math.max(0,Math.min(1,(Date.now()-openT)/d));
}
function L(){ return (CFG.intake||{}).letter||{}; }
function fillTpl(s){
  const v=ST.visitor||{}, lv=lastLetter;
  return String(s||'')
    .replace(/\{first_name\}/g,v.first_name||lv.first_name||'your friend')
    .replace(/\{company\}/g,v.company||lv.company||'their team')
    .replace(/\{email\}/g,v.email||lv.email||'')
    .replace(/\{industry\}/g,lv.industry_name||'what you do');
}
let lastLetter={};
let homeParting='';
function startOpening(){ openScene('house'); setPhase('arctic'); }
function setPhase(p){
  openPhase=p; openT=Date.now();
  $('ov-arctic').classList.toggle('on',p==='arctic');
  $('ov-letter').classList.toggle('on',p==='letter');
  if(p==='arctic'){
    $('a-arctic').textContent=L().arctic||'Somewhere in the Arctic...';
    $('a-arcticsub').textContent=L().arctic_sub||'';
  }
  if(p==='letter'){ paintLetter(); GameAudio.playLocationChime(); }
  if(p==='line1'||p==='line2'){
    // These two used to speak through a bubble floating in the house while the
    // read-back that follows them spoke through CoCo's box, so the voice moved
    // mid-scene. Every house beat now lands in the one place the stylesheet
    // designates for narrative. Held a little past the beat so the line cannot
    // blank out in the gap before the next one arms.
    const txt=fillTpl(p==='line1'?L().line1:L().line2);
    nudge(txt,(OPEN_DUR[p]||2600)+1200); logOpening(txt);
  } else if(p==='summary'){
    trustIdx=0; buildSummary(); paintTrustLine();
  }
  if(p==='map'){
    closeScene();
    // Re-assert after the post-intake state apply, which otherwise repaints the
    // default "use WASD" line over the top of this one. If the home gate left a
    // parting line, lead with it so the sovereignty beat lands before the map.
    const line=fillTpl((homeParting?homeParting+' ':'')+L().map_line);
    homeParting='';
    nudge(line,12000);
    setTimeout(()=>nudge(line,10000),700);
  }
  // Timed phases advance themselves; 'letter' waits for the visitor to submit.
  const d=OPEN_DUR[p];
  if(d){ clearTimeout(setPhase._t); setPhase._t=setTimeout(nextPhase,d); }
}
function nextPhase(){
  // The three-question gate is gone: the stack and location are answered on the
  // letter itself. 'summary' is CoCo reading back what was submitted, and it is
  // where the security and AI points land.
  const order=['arctic','house','post','walk','letter','line1','line2','summary','leave','map'];
  const i=order.indexOf(openPhase);
  if(i<0||openPhase==='map') return;
  if(openPhase==='letter') return;            // blocked until the form is sent
  if(openPhase==='questions') return;         // no longer reachable; kept harmless
  // The trust beat walks through its own lines first, then closes the house
  // panel and hands on to the door.
  if(openPhase==='summary' && trustIdx < trustSeq.length-1){
    trustIdx++; openT=Date.now(); paintTrustLine(); return;
  }
  setPhase(order[i+1]);
}
// Reply mode: the house panel keeps its chat bubble and drops the question
// furniture, so CoCo's closing lines look like part of the conversation the
// visitor was already having rather than a new screen.
function homeReplyMode(on){
  for(const id of ['hq-heading','hq-hint','hq-chips']){
    const el=$(id); if(el) el.style.display=on?'none':'';
  }
  const dock=document.querySelector('#ov-home .dock');
  if(dock) dock.style.display=on?'none':'';
}
function paintTrustLine(){
  // The read-back belongs in CoCo's bubble, which the stylesheet above calls
  // "the ONLY place narrative appears", and since the .hsay bubble that used to
  // float over the house was retired that is now literally true. The
  // nudge is given a little more time than the beat itself so the line cannot
  // blank out in the gap before it advances.
  const txt=trustSeq[trustIdx]||'';
  const dur=trustDur(txt);
  nudge(txt,dur+1200);
  logOpening(txt);
  clearTimeout(setPhase._t);
  setPhase._t=setTimeout(nextPhase,dur);
}
// CoCo reads back what the letter said, then makes the security and AI point
// inside that summary rather than as a separate lecture. The copy lives in
// config (sovereignty.summary) so it is reviewable with every other scripted
// line; only the assembly of what the visitor supplied happens here.
function buildSummary(){
  const v=ST.visitor||{}, lv=lastLetter||{};
  const co=(v.company||lv.company||'').trim();
  const ind=(lv.industry_name||'').trim();
  const popts=(CFG.platforms||{}).options||[];
  const plats=[...homeAns.platforms].map(i=>popts[i]).filter(Boolean);
  // Assembled fragments, so an answer they did not give leaves no dangling
  // clause behind it.
  const bits={
    '{first_name}': v.first_name||lv.first_name||'right',
    '{company_bit}': co?('You are at '+co+(ind?'':'. ')):'',
    '{industry_bit}': ind?((co?', in ':'You work in ')+ind+'. '):'',
    '{platform_bit}': platformBit(plats),
    '{region}': summaryRegion()
  };
  const tpl=((CFG.sovereignty||{}).summary)||[];
  trustSeq=tpl.map(t=>{
    let s=String(t||'');
    for(const [k,val] of Object.entries(bits)) s=s.split(k).join(val);
    return s.replace(/\s{2,}/g,' ').trim();
  }).filter(Boolean);
}
function joinList(a){
  if(a.length===1) return a[0];
  return a.slice(0,-1).join(', ')+' and '+a[a.length-1];
}
// The chips are labels on buttons, not nouns in a sentence: read back literally
// they produced "your data sits on Oracle and Already in Snowflake". The two
// non-platform answers get their own clause instead of being listed.
function platformBit(plats){
  const already=plats.some(o=>/already in snowflake/i.test(o));
  const unsure=plats.some(o=>/not sure/i.test(o));
  const named=plats.filter(o=>!/already in snowflake|not sure/i.test(o));
  if(named.length && already)
    return 'Your data sits on '+joinList(named)+', and some of it is already in Snowflake. ';
  if(named.length && unsure)
    return 'Your data sits on '+joinList(named)+', and we will pin down the rest together. ';
  if(named.length) return 'Your data sits on '+joinList(named)+'. ';
  if(already) return 'Your data is already in Snowflake, so we can start on it straight away. ';
  if(unsure) return 'We will work out where your data lives together. ';
  return '';
}
// The region named in the summary, from the visitor's own location.
function summaryRegion(){
  const C=CFG.country||{}, opts=C.options||[], olab=C.other_label;
  const picked=[...homeAns.country].map(i=>opts[i]).filter(Boolean);
  const real=picked.filter(x=>x!==olab);
  if(!real.length) return 'the region you choose';
  if(real.length===1){
    const rn=(CFG.residency||{}).region_names||{};
    return rn[real[0]]||real[0];
  }
  const eu=(CFG.residency||{}).eu_countries;
  if(eu && !real.every(x=>eu.includes(x))) return 'the region you choose';
  return 'the EU';
}
function openingActive(){ return openPhase && openPhase!=='map'; }
// Click or any key skips the current beat, except while filling the letter in.
// Skip is deliberate, and scoped to the SCENE only. A document-wide click
// listener meant any stray click ate a beat, so four incidental clicks skipped
// the whole intro and visitor two onward never saw it.
function skipBeat(){
  if(!openingActive() || openPhase==='letter' || openPhase==='questions') return;
  // A beat must be on screen for a moment before it can be skipped. Without
  // this, the click that submits the letter (and any impatient second click or
  // Enter) fell straight through and ate line1, line2 and the door exit, so
  // every visitor after the first jumped from the letter to the map.
  if(Date.now()-openT < 600) return;
  clearTimeout(setPhase._t); nextPhase();
}
$('scene').addEventListener('click',skipBeat);
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){
    if(openPhase==='letter') return;      // Enter submits the letter instead
    const t=e.target, tag=((t && t.tagName) || '').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea') return;
    skipBeat();
  }
});

// The letter is rendered FROM CONFIG. Placeholders in the body lines become the
// intake controls, so config.intake.letter.body is the single source of the copy
// and the decision-tree document describes what the visitor actually reads.
const L_CTRL={
  '{first_name}':'<input type="text" id="l-first" class="lin" placeholder="your name" autocomplete="off" spellcheck="false"><span class="req" title="Required">*</span>',
  '{company}':'<input type="text" id="l-company" class="lin" placeholder="company name" autocomplete="off" spellcheck="false">',
  '{industry}':'<select id="l-industry" class="lin lsel"></select>'
};
let lBuilt=false;
function buildLetterBody(){
  if(lBuilt) return;
  const l=L(), ik=CFG.intake||{};
  const lines=(l.body||[]).slice();
  // The last body line ("Could you help us out?") is the closing beat. It moves
  // out of the body into #l-close, which renders AFTER the data/location
  // questions, so the letter reads problem -> data -> location -> closing.
  const closing = lines.length ? lines.pop() : '';
  const html=lines.map(raw=>{
    let s=esc(String(raw||''));
    // esc() leaves braces alone, so the placeholders survive escaping and the
    // config copy around them can never inject markup.
    for(const [tok,ctrl] of Object.entries(L_CTRL)) s=s.split(tok).join(ctrl);
    return `<p class="lp">${s}</p>`;
  });
  // The problem field is the one input with no placeholder in the body copy,
  // because its label is a separate config string. It ends the handwriting.
  const plabel=esc(ik.problem_label||'The problem you want to solve');
  html.push(`<p class="lp">${plabel}<br>`
    +`<textarea id="l-problem" class="lin lta" rows="2" spellcheck="false"></textarea></p>`);
  $('l-body').innerHTML=html.join('');
  // Closing line + sign-off, after the questions. {first_name} mirrors the name
  // input rather than being a second field.
  let closeHtml='';
  if(closing) closeHtml += `<p class="lp">${esc(String(closing))}</p>`;
  if(l.signoff){
    closeHtml += '<p class="lp lsign">'
      +esc(String(l.signoff)).split('{first_name}')
        .join('<span id="l-sign">\u2026</span>')+'</p>';
  }
  $('l-close').innerHTML=closeHtml;
  const fn=$('l-first'), sg=$('l-sign');
  if(fn && sg){
    const sync=()=>{ sg.textContent=fn.value.trim()||'\u2026'; };
    fn.addEventListener('input',sync); sync();
  }
  lBuilt=true;
}
function paintLetter(){
  const l=L();
  buildLetterBody();
  $('l-bubble').textContent=l.bubble||"Wow, a letter from my friend!";
  $('l-greet').textContent=l.greeting||'Hey CoCo,';

  $('l-go').textContent=l.button||"THAT'S BETTER";
  const s=$('l-industry');
  if(!s.options.length){
    // A visible placeholder rather than a blank underline: mid-sentence, an
    // empty select read as a rendering fault. Empty value still means "guess".
    s.innerHTML='<option value="" selected>(or let CoCo guess)</option>'+
      Object.entries(CFG.industries).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');
  }
  const ik=CFG.intake||{};
  // The example problem belongs to the visitor's world, not to engineering. It
  // swaps as soon as an industry is chosen, and falls back to the generic one
  // while the dropdown still reads "(or let CoCo guess)".
  syncProblemPlaceholder();
  paintLetterAsk();
  const sel=$('l-industry');
  if(sel && !sel.dataset.phwired){
    sel.dataset.phwired='1';
    sel.addEventListener('change',syncProblemPlaceholder);
  }
  setTimeout(()=>$('l-first').focus(),260);
}
function syncProblemPlaceholder(){
  const ta=$('l-problem'); if(!ta) return;
  const ik=CFG.intake||{};
  const key=($('l-industry')||{}).value||'';
  const own=((CFG.industries||{})[key]||{}).problem_placeholder;
  ta.placeholder=own||ik.problem_placeholder||'in two sentences...';
}
// ---------------- the stack and location, asked inside the letter ----------
// The residency question is gone. It only ever named the region in the
// blueprint's sovereignty pillars, and a visitor's own location answers that
// more honestly than a fourth question they have to interpret.
function paintLetterAsk(){
  const P=CFG.platforms||{}, C=CFG.country||{};
  $('l-stackq').textContent=hqFill(P.heading||'Where does your data live today?');
  $('l-locq').textContent=hqFill(C.heading||'And where are you based?');
  const chip=(label,on,fn)=>{
    const b=document.createElement('div');
    b.className='chip'+(on?' on':''); b.textContent=label;
    b.addEventListener('click',fn); return b;
  };
  const sc=$('l-stackchips'); sc.innerHTML='';
  (P.options||[]).forEach((o,i)=>
    sc.appendChild(chip(o,homeAns.platforms.has(i),()=>{ togglePlat(i); paintLetterAsk(); })));
  // A single-country event (Hayadata) fixes the answer: hide the question and
  // record the default, so residency and the blueprint still see a country.
  const di=C.default?(C.options||[]).indexOf(C.default):-1;
  $('l-loc').style.display=di>=0?'none':'';
  if(di>=0){ homeAns.country=new Set([di]); return; }
  const lc=$('l-locchips'); lc.innerHTML='';
  (C.options||[]).forEach((o,i)=>
    lc.appendChild(chip(o,homeAns.country.has(i),()=>{ pickCountry(i); paintLetterAsk(); })));
  const olab=C.other_label;
  const other=[...homeAns.country].some(j=>(C.options||[])[j]===olab);
  $('l-locotherwrap').style.display=other?'':'none';
}
// CoCo's reaction to the stack, from the same closed set the gate used.
function platReply(picks){
  const excl=(CFG.platforms||{}).exclusive||[];
  const named=picks.filter(o=>!excl.includes(o));
  let key='platform_named', plat=named[0]||picks[0];
  if(picks.some(o=>/already in snowflake/i.test(o)) && !named.length) key='platform_already';
  else if(picks.some(o=>/not sure/i.test(o)) && !named.length) key='platform_unsure';
  return sov(key).replace(/\{platform\}/g,plat||'your platform');
}
// Residency, derived from where they said they are. The strictest reading that
// their own answer supports: a single country means that country, several EU
// countries mean the EU, anything outside means we do not assume.
function inferResidency(){
  const C=CFG.country||{}, opts=C.options||[], olab=C.other_label;
  const picked=[...homeAns.country].map(i=>opts[i]).filter(Boolean);
  if(!picked.length) return 'unsure';
  const offshore=picked.some(x=>x===olab);
  if(offshore) return 'unsure';
  if(picked.length===1) return 'country_only';
  // Several countries only mean the EU when every one of them is in it.
  const eu=(CFG.residency||{}).eu_countries;
  if(eu && !picked.every(x=>eu.includes(x))) return 'unsure';
  return 'eu';
}

async function submitLetter(){
  const first=$('l-first').value.trim(), company=$('l-company').value.trim(),
        industry=$('l-industry').value||null,
        problem=$('l-problem').value.trim();
  if(!first){ $('l-first').classList.add('invalid');
    $('l-hint').textContent='CoCo needs a name.'; return; }
  $('l-first').classList.remove('invalid'); $('l-hint').textContent='';
  const iname=(CFG.industries[industry]||{}).name||'';
  lastLetter={first_name:first,company:company,industry_name:iname};
  $('l-go').disabled=true;
  try{
    await post('/api/intake',{first_name:first,company:company,industry:industry,problem:problem});
    // The stack and location came in on the letter, so they are recorded here
    // rather than behind a separate gate. Residency is inferred from the
    // location: it only names the region in the sovereignty pillars.
    const olab=(CFG.country||{}).other_label;
    if([...homeAns.country].some(j=>((CFG.country||{}).options||[])[j]===olab)){
      homeAns.countryText=($('l-locother')||{}).value?$('l-locother').value.trim().slice(0,60):'';
    }
    const popts=(CFG.platforms||{}).options||[];
    if(homeAns.platforms.size || homeAns.country.size){
      const plats=[...homeAns.platforms].map(i=>popts[i]).filter(Boolean);
      homeLog.length=0;
      if(plats.length) homeLog.push({text:plats.join(', '), reply:platReply(plats)});
      if(homeAns.country.size) homeLog.push({text:countryWord(), reply:sov('country').replace(/\{country\}/g,countryWord())});
      try{
        await post('/api/home',{platforms:plats, company_country:countryWord(),
          residency:inferResidency(), exchanges:homeLog});
      }catch(e){ /* enrichment, not correctness */ }
    }
    // Re-fetch the checklists: /api/options is keyed on the visitor's INDUSTRY,
    // and until the letter is submitted the server does not know it, so the
    // boot-time fetch returns the generic "Something else" set. Without this a
    // healthcare visitor was offered "Core operational records" instead of
    // "Patient records" and "Clinical notes" - the industry tailoring existed
    // in config and on the server, and was thrown away by a stale client cache.
    await loadOptions();
    await poll();
    $('ov-letter').classList.remove('on');
    setPhase('line1');
  }catch(e){ showErr('cannot reach server'); }
  $('l-go').disabled=false;
}
$('l-go').addEventListener('click',submitLetter);
$('ov-letter').addEventListener('keydown',e=>{
  e.stopPropagation();                       // belt and braces over the global guard
  if(e.key==='Enter') submitLetter();
});


// ---------------- home-stage question gate ----------------
// Between the letter and the map, blocking and click-only: where the data
// lives, where the company is based, and the residency rules. CoCo reacts to
// each answer in the bubble, planting the sovereignty benefits the blueprint
// later reinforces. Nothing here is free-text-required - "Other" is optional.
let homeStep=0;
const homeAns={ platforms:new Set(), country:new Set(), countryText:'', residency:new Set() };
// What the visitor was asked and what CoCo answered, so the house shows up in
// the scroll-back history alongside the other locations.
const homeLog=[];
function countryWord(){
  // Multi-select, so this can be a list. Reads as prose because it lands inside
  // CoCo's spoken line and in the blueprint, not in a form field.
  const opts=(CFG.country||{}).options||[], olab=(CFG.country||{}).other_label;
  const fb=(CFG.residency||{}).fallback_country||'your country';
  if(!homeAns.country.size) return fb;
  const names=[];
  for(const i of [...homeAns.country].sort((a,b)=>a-b)){
    const label=opts[i]||'';
    if(label===olab) names.push(homeAns.countryText||fb);
    else if(label) names.push(label);
  }
  const uniq=[...new Set(names)];
  if(!uniq.length) return fb;
  if(uniq.length===1) return uniq[0];
  return uniq.slice(0,-1).join(', ')+' and '+uniq[uniq.length-1];
}
function sov(key){ return ((CFG.sovereignty||{}).react||{})[key]||''; }
function openHomeQuestions(){
  homeStep=0; homeAns.platforms=new Set(); homeAns.country=new Set();
  homeAns.countryText=''; homeAns.residency=new Set(); homeLog.length=0;
  $('ov-home').classList.add('on');
  homeReplyMode(false);
  $('hq-bubble').textContent=hqFill('Before we set off, three quick things about '
    +'{company} \u2014 they decide how your blueprint gets built.');
  renderHomeStep();
}
// The letter is already filled in by the time these are asked, so use it. A
// question that says the company's name is CoCo remembering what you just told
// him; a generic "your data" is a form.
function hqFill(t){
  const v=(ST.visitor||{});
  const co=(v.company||'').trim();
  const ind=((CFG.industries||{})[v.industry]||{}).label||'';
  return String(t||'')
    .replace(/\{company\}/g, co||'your organisation')
    .replace(/\{company_s\}/g, co?(co+(/s$/i.test(co)?'\u2019':'\u2019s')):'your organisation\u2019s')
    .replace(/\{industry\}/g, ind||'your sector')

}
function renderHomeStep(){
  const other=$('hq-otherwrap'); other.style.display='none'; $('hq-other').value='';
  const wrap=$('hq-chips');
  if(homeStep===0){
    const p=CFG.platforms||{};

    [...wrap.children].forEach(el=>el.addEventListener('click',()=>togglePlat(+el.dataset.i)));
  } else if(homeStep===1){
    const c=CFG.country||{};

    $('hq-hint').textContent=hqFill(c.hint||'');

      `<div class="chip${homeAns.country.has(i)?' on':''}" data-i="${i}">${esc(o)}</div>`).join('');

  } else {
    const r=CFG.residency||{}, cw=countryWord();
    $('hq-heading').textContent=hqFill(r.heading||'Where are your data and models allowed to run?');
    $('hq-hint').textContent=hqFill(r.hint||'');

    [...wrap.children].forEach(el=>el.addEventListener('click',()=>pickResidency(+el.dataset.i)));

function paintHomeChips(){
  [...$('hq-chips').children].forEach((c,j)=>{
    const on = homeStep===0 ? homeAns.platforms.has(j)
             : homeStep===1 ? homeAns.country.has(j)
             : homeAns.residency.has(j);
    c.classList.toggle('on',on);
  });
}
function togglePlat(i){
  const p=CFG.platforms||{}, opt=(p.options||[])[i], excl=(p.exclusive||[]), isExcl=excl.includes(opt);
  if(homeAns.platforms.has(i)) homeAns.platforms.delete(i);
  else{
    homeAns.platforms.add(i);
    // Only a genuinely exclusive chip clears the rest. "Not sure yet" is the
    // absence of an answer, so it cannot sit beside one. "Already in Snowflake"
    // is a real answer that combines freely - an estate is often part here and
    // part elsewhere - and the blueprint prints a combined route for it.
    (p.options||[]).forEach((o2,j)=>{
      if(j===i) return;
      if(isExcl ? true : excl.includes(o2)) homeAns.platforms.delete(j);
    });
  }
  paintHomeChips();
}
// Both of these are multi-select. A company with branches is based in more than
// one country, and "where may this run" is rarely one answer either - a group
// can be tied to its home country for patient data and relaxed about the rest.
// Forcing one tap made visitors pick the least wrong option and lose the truth.
function pickCountry(i){
  if(homeAns.country.has(i)) homeAns.country.delete(i);
  else homeAns.country.add(i);
  const olab=(CFG.country||{}).other_label;
  const other=[...homeAns.country].some(j=>(CFG.country||{}).options[j]===olab);
  $('hq-otherwrap').style.display=other?'':'none';
  paintHomeChips();
}
function pickResidency(i){
  if(homeAns.residency.has(i)) homeAns.residency.delete(i);
  else homeAns.residency.add(i);
  paintHomeChips();
}
async function homeContinue(){
  if($('hq-go').disabled) return;
  if(homeStep===0){
    if(!homeAns.platforms.size){ $('hq-step').textContent='Tap at least one'; return; }
    const opts=(CFG.platforms||{}).options||[], picks=[...homeAns.platforms].map(i=>opts[i]);
    const excl=(CFG.platforms||{}).exclusive||[];
    const named=picks.filter(o=>!excl.includes(o));
    let key='platform_named', plat=named[0]||picks[0];
    if(picks.some(o=>/already in snowflake/i.test(o))) key='platform_already';
    else if(picks.some(o=>/not sure/i.test(o))) key='platform_unsure';
    $('hq-bubble').textContent=sov(key).replace(/\{platform\}/g,plat);
    homeLog.push({text:picks.join(', '), reply:$('hq-bubble').textContent});
    homeStep=1; renderHomeStep(); return;
  }
  if(homeStep===1){
    if(!homeAns.country.size){ $('hq-step').textContent='Tap at least one'; return; }
    const olab=(CFG.country||{}).other_label;
    const other=[...homeAns.country].some(j=>(CFG.country||{}).options[j]===olab);
    if(other) homeAns.countryText=$('hq-other').value.trim().slice(0,60);
    $('hq-bubble').textContent=sov('country').replace(/\{country\}/g,countryWord());
    homeLog.push({text:countryWord(), reply:$('hq-bubble').textContent});
    homeStep=2; renderHomeStep(); return;
  }
  // step 2: residency
  if(!homeAns.residency.size){ $('hq-step').textContent='Tap at least one'; return; }
  // The parting line speaks to the STRICTEST thing they picked: if anything must
  // stay in country, that is the constraint that shapes the build, whatever else
  // they also allowed.
  const rkeys=['residency_country_only','residency_eu','residency_us_ok','residency_unsure'];
  const strict=[...homeAns.residency].sort((a,b)=>a-b)[0];
  const parting=sov(rkeys[strict]||'residency_unsure').replace(/\{country\}/g,countryWord());
  const rlabels=((CFG.residency||{}).options_template||[])
    .map(t=>String(t).replace(/\{country\}/g,countryWord()));
  homeLog.push({text:[...homeAns.residency].sort((a,b)=>a-b)
    .map(i=>rlabels[i]).filter(Boolean).join(', '), reply:parting});
  $('hq-go').disabled=true;
  const opts=(CFG.platforms||{}).options||[];
  try{
    await post('/api/home',{
      platforms:[...homeAns.platforms].map(i=>opts[i]).filter(Boolean),
      company_country:countryWord(),
      residency:[...homeAns.residency].sort((a,b)=>a-b)
        .map(i=>['country_only','eu','us_ok','unsure'][i]).filter(Boolean)
        .join(', ') || 'unsure',
      exchanges:homeLog,
    });
  }catch(e){ /* non-fatal: home answers enrich, they do not gate correctness */ }
  await poll();
  $('hq-go').disabled=false;
  homeParting='';
  setPhase('summary');
}
$('hq-go').addEventListener('click',homeContinue);

// The journey as four tiles in the HUD: one per stop, in flow order. Shows
// where the visitor is ("here now"), where they have been (what they picked),
// and what is still to come. Persistent at the top of the page; replaces the
// old Player/Industry readout and the in-panel copy of the same tiles.
function paintHudJourney(){
  const hud=$('hud'); if(!hud || !CFG.locations) return;
  const ids=Object.keys(CFG.locations);
  const cur = panelOpen ? panelLoc : nearId;
  const turnFor=lid=>(ST.turns||[]).filter(t=>t.location===lid).slice(-1)[0];
  hud.innerHTML=ids.map(lid=>{
    const l=CFG.locations[lid]||{}, t=turnFor(lid), here=lid===cur, done=visited.has(lid);
    const cls = here ? 'cur' : (done ? 'done' : '');
    // The checklist stops hand back a comma-separated list, which summarise()
    // turns into a count. The workshop hands back a free-text brief with no
    // commas in it, so that branch never fired and the tile showed the entire
    // sentence. What matters here is that the brief is in, not what it said.
    const val = here ? 'here now'
      : done ? ((l.mode==='compose' ? 'brief set' : summarise(t&&t.text)) || 'done')
      : 'to come';
    const vcls = (!here && !done) ? ' tocome' : '';
    // Short label: "THE DATA LIBRARY" will not fit four across.
    const key=String(l.name||lid).replace(/^The\s+/i,'');
    return `<div class="tile ${cls}"><div class="k">${esc(key)}</div>`
      +`<div class="v${vcls}">${esc(val)}</div></div>`;
  }).join('');
}
// Tiles are narrow, so show a count rather than truncating a list mid-word.
function summarise(text){
  const parts=String(text||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(parts.length>1) return parts.length+' chosen';
  const one=parts[0]||'';
  // A single long value - a typed "other" entry, say - would still be handed to
  // a ~250px box whole. Cut on a word boundary so the tile is never carrying a
  // sentence it cannot show.
  if(one.length<=24) return one;
  let out='';
  for(const w of one.split(/\s+/)){
    if((out?out+' '+w:w).length>22) break;
    out=out?out+' '+w:w;
  }
  return (out||one.slice(0,22))+'\u2026';
}

// How many options are below the fold. Counted from the options themselves, not

// Escape is the operator's escape hatch, but it must not walk out on a run that
// is still in flight. The workshop's answer is being written at the moment it is
// pressed - the button beside it is already disabled and reading THINKING - so
// leaving here abandoned the very thing the visitor had just asked CoCo to
// build, and they returned to the map with nothing. A hung agent must not trap
// them either, so the hatch reopens once the run has outlived the server's own
// per-turn ceiling, past which the turn is not coming back anyway.
let runStart=0;
const RUN_HATCH_MS=75000;    // coco.turn_timeout is 60s; this is that plus slack
function runInFlight(){
  return panelOpen && isPov(panelLoc) && inScenePhase==='await'
    && !!ST.thinking && runStart && Date.now()-runStart < RUN_HATCH_MS;
}
function tryClosePanel(){
  if(runInFlight()) return;
  closePanel();
}

// Repaint the body from a fresher payload. The agentic search is merged server
// side during delivery, which is AFTER this card first rendered, so without this
// a find that arrived late would only ever appear in the document. The delivery
// poll is already fetching the same endpoint every 700ms; this just stops it
// throwing away the half of the answer it was not looking at.
function repaintBp(d){
  if(!d || !(d.poc||{}).poc_name) return;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  renderBpBody(d,(d.features||[]).map(f=>f.name||f).filter(Boolean),d.joined||[],li);
}
function renderBpBody(d,featNames,joinNames,li){
  const p=d.poc||{};
  // The 7th option's agentic find reaches the DOCUMENT (blueprint_docx renders
  // every joined_listings row) but used to be invisible here, because this card
  // listed d.joined - the labels they ticked - and the agentic row is merged into
  // joined_listings only. A visitor who typed "global movement data" was shown
  // their own words back and no sign CoCo had matched anything, then found a
  // Mapbox listing in the document. So: any listing whose title is not one of
  // their picks is by definition something CoCo added, which needs no new server
  // field to identify. Named separately rather than mixed into their list, because
  // the honest claim is "we found this", not "you chose this".
  const picked=new Set(joinNames);
  const found=(d.listings||[]).map(r=>r&&r.title).filter(t=>t&&!picked.has(t));
  $('bp').innerHTML = `
    <h3>What you are building</h3><div style="font-size:15px">${esc(p.poc_name)}</div>
    <div style="font-size:13px;color:#8FA6B8;margin-top:3px">${esc(p.summary||'')}</div>
    ${joinNames.length?`<h3>Data you are attaching</h3><ul>${li(joinNames)}</ul>`:''}
    ${found.length?`<h3 class="coco">CoCo also found for you</h3><ul>${li(found)}</ul>`:''}
    ${featNames.length?`<h3>Snowflake features in play</h3><ul>${li(featNames.slice(0,4))}</ul>`:''}
    <div style="margin-top:12px;font-size:13px;color:#8FA6B8;line-height:1.5">
      The full brief, the Cortex Code prompt${p.guide_title?', the guide to fork':''}
      and your Word document all travel with the blueprint. Scan the code
      below to take it with you.</div>`;
}
function paintSendBtn(d){
  const btn=$('bp-send'), sub=$('bp-sub'), keys=$('bp-keys'), h2=$('bp-h2');
  const qual=$('bp-qual');
  qual.style.display='none';
  if(d.se_ended){
    // Below the SE threshold: the game ends here, kindly, with no document.
    $('bp-bonus').style.display='none'; $('bp-cap').style.display='none';
    $('bp-hand').classList.remove('on');
    h2.textContent=qualText('not_qualified_heading');
    sub.textContent='';
    $('bp').textContent=qualText('not_qualified_body');
    btn.disabled=false; btn.textContent=qualText('not_qualified_button')||'FINISH';
    keys.textContent='';

  }
  if(d.queued || d.draft_created){
    if(d.qualified && qualOn() && d.document_url){
      showSeWin();
      if(!$('ov-se').classList.contains('on')){ qual.textContent=qualText('qualified_line'); qual.style.display=''; }
    }
    $('bp-bonus').style.display='none';         // bonus catch-up closes on send
    h2.textContent='Your blueprint is ready';
    // Delivery and FINISHING are two presses, not one. Retiring the button here
    // stranded the visitor: the posting scene played behind this card and the
    // closing postcard was only reachable by pressing Escape, which nobody
    // does. So once the document is staged the button becomes the closing
    // action - scan first, then post it and watch it go.
    const ready=!!d.document_url;
    sub.textContent=ready?'Scan the code below, then post it to watch it go.'
                         :'Staging your document\u2026';
    btn.disabled=!ready;
    // The SECOND press has its own label: by now the document exists and the QR
    // is on screen, so "post it to me" read as though the first press had failed.
    btn.textContent=ready?((CFG.locations.postbox||{}).button_sent||'SEE MY POSTCARD')
                         :'FINISHING\u2026';
    keys.textContent=ready?'Scan it first - then post it and see your card'
                          :'Staging your document\u2026';
  } else {
    h2.textContent='Ready to post';
    sub.textContent='I\u2019ll build your document and hand it straight to you.';
    const needCap=qualOn() && capPick===null;
    btn.disabled=needCap; btn.textContent=(CFG.locations.postbox||{}).button||'CREATE MY BLUEPRINT';
    keys.textContent=needCap?(((QUAL().capacity)||{}).required||'Pick one first')
                            :'Builds your document and your QR code';
  }
  paintHandover(d);
}
// Show the QR only once there is a real presigned URL behind it: a code that
// resolves to nothing is worse than no code at all.
function paintHandover(d){
  const wrap=$('bp-hand'), url=d.document_url||'';
  if(!url){ wrap.classList.remove('on'); return; }
  $('bp-qr').src='/api/qr?u='+encodeURIComponent(url);
  $('bp-qr').onerror=()=>{                       // segno missing: link only
    $('bp-qr').style.display='none';
    $('bp-handp').textContent='Open this link to download your Word blueprint. '
      +'It works for seven days.';
  };
  const a=$('bp-link'); a.href=url;
  a.textContent=url.length>62?url.slice(0,62)+'\u2026':url;
  // And the same blueprint as a page you can actually READ, served by us with a
  // real content type. The QR cannot point here - a presigned stage URL serves
  // octet-stream whatever the extension, so a phone downloads the .html rather
  // than rendering it - so this is the booth-screen and email surface, and the
  // .docx is what travels.
  // The on-screen HTML blueprint is gone: the Word document behind the QR is
  // the single artifact, so there is only one thing to review and QA.
  wrap.classList.add('on');
}
async function sendPoc(){
  const btn=$('bp-send'); if(btn.disabled) return;
  // Second press, once the document is already staged: this is the closing
  // beat, not another build.
  if((window.__bp||{}).document_url || (window.__bp||{}).se_ended) return finishVisit();
  btn.disabled=true; btn.textContent='BUILDING IT\u2026';
  $('bp-sub').textContent='Writing your document and staging it\u2026';
  try{
    const r=await post('/api/send',qualOn()?{capacity:capPick}:{});
    if(!r.ok){ btn.disabled=false; btn.textContent=(CFG.locations.postbox||{}).button||'CREATE MY BLUEPRINT';
      $('bp-sub').textContent='That did not go through \u2014 try once more.'; return; }
  }catch(e){ btn.disabled=false; btn.textContent=(CFG.locations.postbox||{}).button||'CREATE MY BLUEPRINT';
    $('bp-sub').textContent='Cannot reach the server.'; return; }
  // The send runs in a background thread, so a single re-read raced it and the
  // QR never appeared - hence polling. But the budget used to be 30 x 700ms,
  // and a real visit measured ~21s: the QA COMPLETE call, the stage upload and
  // the presign are three separate `snow` CLI invocations, each paying process
  // start and connection setup, on top of a possible warehouse resume. Landing
  // one second over the budget left the loop falling out silently with the
  // button still disabled and still reading BUILDING IT, forever, while the
  // document sat finished on the stage. That is a dead end with a visitor
  // watching, so the budget now exceeds the server's own timeouts (8s pending
  // wait + 120s upload + 90s presign) rather than undercutting them.
  const t0=Date.now();
  for(let i=0;i<260;i++){
    await new Promise(r=>setTimeout(r,700));
    let d; try{ d=await (await fetch('/api/blueprint',{cache:'no-store'})).json(); }
    catch(e){ continue; }
    window.__bp=d;
    if(d.se_ended){ paintSendBtn(d); return; }
    repaintBp(d);
    if(d.document_url || d.queued || d.draft_created){ paintSendBtn(d); }
    if(d.document_url) return;
    // Something has to move on screen, or a twenty-second wait reads as a hang.
    const s=Math.round((Date.now()-t0)/1000);
    if(s>=4) $('bp-sub').textContent =
      'Writing your document and staging it\u2026 ('+s+'s)';
  }
  // Genuinely gave up. Hand the press back rather than leaving a dead button.
  btn.disabled=false;
  btn.textContent=(CFG.locations.postbox||{}).button||'CREATE MY BLUEPRINT';
  $('bp-sub').textContent='Still working on it \u2014 press again to check.';
}
function closeBp(){
  $('ov-bp').classList.remove('on'); reopenLock=Date.now()+700;
  // Escape and outside-click keep working as an operator escape hatch, and land
  // in the same place the button does.
  const d=window.__bp||{};
  if(d.document_url || d.se_ended) finishVisit();
}
// The closing beat. The card comes DOWN first so the posting scene is actually
// visible - playing it behind the blueprint was why nobody ever saw it - and
// the postcard follows once the letter is in the box.
let finishing=false;
function finishVisit(){
  if(finishing) return; finishing=true;
  GameAudio.stopAll(); GameAudio.playAchievement();
  $('ov-bp').classList.remove('on'); reopenLock=Date.now()+700;
  postingFlourish();
  setTimeout(showBoard, POST_MS+260);
}
$('bp-send').addEventListener('click',sendPoc);
// The letter physically going in the box, played in the clear on the way to the
// closing postcard. The blueprint QR is not lost by leaving this card: the
// postcard stages its own code and carries the document link too.
function postingFlourish(){
  postT=Date.now(); openScene('postbox');

// ---------------- bonus objectives ----------------
// Optional. An object spawns ONLY while the visitor is free on the map, with a
// countdown to reach it (paused whenever a stop or overlay is open). Walking
// onto it opens the question with no answer timer. Missing it is never a
// penalty beyond the points: it can be answered at the postbox for half.
const BONUS=()=>CFG.bonus||{};
const bonusCopy=k=>((BONUS().copy||{})[k])||'';
let bonusPending=null, bonusObj=null, bonusSeen=new Set(), bonusNotBefore=0,
    bonusLastT=0, bonusBusy=false, lastScore=0;
function onMapFree(){
  return haveVisitor() && !openingActive() && !blocking() && !sceneActive
    && !finishing && !ST.queued && $('ov-done').style.display==='none';
}
function bonusOnState(s){
  if(!BONUS().enabled) return;
  const nx=(s.bonus||{}).next;
  if(nx && !bonusSeen.has(nx.id) && (!bonusPending || bonusPending.id!==nx.id)
     && (!bonusObj || bonusObj.id!==nx.id)){
    bonusPending=nx; bonusNotBefore=Date.now()+(BONUS().spawn_delay_ms||1500);
  }
  const sc=+s.score||0;
  $('h-scorek').textContent=bonusCopy('score_label');
  // countUp() owns the number while it animates; only sync when it is idle.
  if(sc<lastScore || sc===lastScore || !lastScore) $('h-score').textContent=sc.toLocaleString();
  else countUp(sc);
  lastScore=sc;
}
function pickBonusTile(){
  const near=(x,y)=>Object.values(CFG.locations).some(l=>
    Math.abs(l.tile[0]-x)<=1 && Math.abs(l.tile[1]-y)<=1);
  const c=[];
  for(let y=1;y<ROWS;y++) for(let x=1;x<COLS;x++){
    const d=Math.max(Math.abs(x-P.x),Math.abs(y-P.y));
    if(d>=4 && d<=8 && walkable(x,y) && !near(x,y)) c.push([x,y,map[y][x]===3?3:1]);
  }
  if(!c.length) return null;
  const pool=c.flatMap(t=>Array(t[2]).fill(t));       // paths weighted 3x
  return pool[Math.floor(Math.random()*pool.length)];
}
function stepBonus(){
  const now=Date.now(), dt=bonusLastT?now-bonusLastT:0; bonusLastT=now;
  if(!BONUS().enabled) return;
  if(!bonusObj && bonusPending && now>=bonusNotBefore && onMapFree()){
    const t=pickBonusTile();
    if(t){
      bonusObj={...bonusPending, x:t[0], y:t[1],
                shape:BONUS_SHAPES[[...bonusPending.id].reduce((a,c)=>a+c.charCodeAt(0),0)
                                   % BONUS_SHAPES.length],
                left:(BONUS().spawn_seconds||7)*1000};
      bonusSeen.add(bonusPending.id); bonusPending=null;
      GameAudio.playLocationChime();
    }
  }
  if(!bonusObj || bonusBusy) return;
  if(onMapFree()) bonusObj.left-=dt;       // the clock only runs while free
  if(P.x===bonusObj.x && P.y===bonusObj.y && onMapFree()) return openBonus();
  if(bonusObj.left<=0) missBonus(true);
}
function drawBonus(g){
  if(!bonusObj) return;
  const th=CFG.theme, X=bonusObj.x*T*S+T*S/2, Y0=bonusObj.y*T*S+T*S/2;
  const frac=Math.max(0,bonusObj.left)/((BONUS().spawn_seconds||7)*1000);
  const urgent=frac<0.3;
  const r=T*S*0.36, bob=Math.sin(tick/(urgent?5:9))*S*1.6, Y=Y0-S*2+bob;
  const col=BONUS_COLOURS[bonusObj.shape]||'accent_warm';
  // ground shadow: shrinks as the icon bobs up, so it reads as floating
  g.globalAlpha=0.28; g.fillStyle=th.ansi_black; g.beginPath();
  g.ellipse(X,Y0+r*0.95,r*(0.75-bob/(S*20)),r*0.22,0,0,Math.PI*2); g.fill();
  // soft halo in the shape's own colour, breathing
  const breathe=0.5+0.5*Math.sin(tick/(urgent?4:10));
  [[2.3,0.07],[1.8,0.12],[1.35,0.18]].forEach(([k,a])=>{
    g.globalAlpha=a*(0.7+0.3*breathe); g.fillStyle=th[col]; g.beginPath();
    g.arc(X,Y,r*k,0,Math.PI*2); g.fill(); });
  g.globalAlpha=1;
  drawBonusShape(g,bonusObj.shape,X,Y,r,th);
  // orbiting twinkles
  for(let i=0;i<3;i++){
    const a=tick/22+i*Math.PI*2/3, tx=X+Math.cos(a)*r*1.7, ty=Y+Math.sin(a)*r*1.1;
    const s=S*(1+0.8*Math.max(0,Math.sin(tick/7+i*2)));
    g.fillStyle=th.snow_bright; g.fillRect(tx-s/2,ty-S/4,s,S/2); g.fillRect(tx-S/4,ty-s/2,S/2,s);
  }
  // countdown ring, turning red in the last 30%
  g.strokeStyle=urgent?th.ansi_red_bright:th.accent; g.lineWidth=S*1.6; g.lineCap='round';
  g.beginPath(); g.arc(X,Y,r*1.75,-Math.PI/2,-Math.PI/2+Math.PI*2*frac); g.stroke(); g.lineCap='butt';
  // value tag: what it is worth RIGHT NOW, draining while they run for it
  g.font=`bold ${9*S/2}px ui-monospace, monospace`; g.textAlign='center';
  const lab='+'+bonusPointsNow()+'  '+Math.ceil(Math.max(0,bonusObj.left)/1000)+'s';
  const w=g.measureText(lab).width+14, LY=Y-r*2.6-14;
  g.fillStyle='rgba(44,52,68,.88)'; g.fillRect(X-w/2,LY,w,17);
  g.fillStyle=th[col]; g.fillRect(X-w/2,LY+15,w*frac,2);
  g.fillStyle=urgent?th.ansi_red_bright:th.accent_warm; g.fillText(lab,X,LY+12); g.textAlign='left';
}
const BONUS_COLOURS={crystal:'accent_warm',star:'ansi_yellow_bright',fish:'accent',
  snowflake:'snow_bright',coin:'ansi_yellow',heart:'ansi_red_bright'};
// Client-side mirror of server map_points(), for display only. The server
// recomputes the real value from the same clamped left_ms.
function bonusPointsNow(){
  const sc=BONUS().scoring||{}, base=+sc.map||100, mx=+sc.map_max_multiplier||1;
  const frac=Math.min(1,Math.max(0,(bonusObj?bonusObj.left:0)/((BONUS().spawn_seconds||7)*1000)));
  return Math.round(base*(1+(mx-1)*frac)/10)*10;
}
const BONUS_SHAPES=['crystal','star','fish','snowflake','coin','heart'];
function drawBonusShape(g,shape,X,Y,r,th){
  // Every shape gets a dark outline and a white glint, so it pops off the snow.
  const outline=()=>{ g.strokeStyle=th.ansi_black; g.lineWidth=S*1.2; g.stroke(); };
  const glint=(gx,gy,s)=>{ g.fillStyle=th.snow_bright; g.globalAlpha=0.9;
    g.fillRect(X+gx*r,Y+gy*r,S*s,S*s); g.globalAlpha=1; };
  const poly=(pts,col)=>{ g.fillStyle=col; g.beginPath();
    pts.forEach(([x,y],i)=>i?g.lineTo(X+x*r,Y+y*r):g.moveTo(X+x*r,Y+y*r));
    g.closePath(); g.fill(); outline(); };
  if(shape==='star'){
    const spin=tick/40, p=[];
    for(let i=0;i<10;i++){ const a=-Math.PI/2+spin+i*Math.PI/5, k=i%2?0.45:1.05;
      p.push([Math.cos(a)*k,Math.sin(a)*k]); }
    poly(p,th.ansi_yellow_bright);
    g.fillStyle=th.ansi_yellow; g.beginPath(); g.arc(X,Y,r*0.28,0,Math.PI*2); g.fill();
    glint(-0.35,-0.5,2);
  } else if(shape==='fish'){
    const wag=Math.sin(tick/5)*0.18;
    poly([[0.5,0],[1.15,-0.6+wag],[1.0,0],[1.15,0.6+wag]],th.accent);    // tail
    g.fillStyle=th.accent; g.beginPath(); g.ellipse(X-r*0.15,Y,r*0.9,r*0.55,0,0,Math.PI*2);
    g.fill(); outline();
    g.fillStyle=th.ansi_blue_bright; g.beginPath();
    g.ellipse(X-r*0.15,Y+r*0.18,r*0.6,r*0.2,0,0,Math.PI*2); g.fill();      // belly
    g.fillStyle=th.snow_bright; g.beginPath(); g.arc(X-r*0.62,Y-r*0.12,r*0.17,0,Math.PI*2); g.fill();
    g.fillStyle=th.ansi_black; g.fillRect(X-r*0.66,Y-r*0.16,S*1.4,S*1.4);  // eye
  } else if(shape==='snowflake'){
    const spin=tick/60;
    g.lineCap='round';
    [[th.ansi_black,S*3.2],[th.accent,S*1.8]].forEach(([c,w])=>{
      g.strokeStyle=c; g.lineWidth=w; g.beginPath();
      for(let i=0;i<6;i++){ const a=spin+i*Math.PI/3, ex=Math.cos(a)*r*1.05, ey=Math.sin(a)*r*1.05;
        g.moveTo(X,Y); g.lineTo(X+ex,Y+ey);
        const bx=X+ex*0.6, by=Y+ey*0.6;
        for(const s of [-1,1]){ const b=a+s*0.7;
          g.moveTo(bx,by); g.lineTo(bx+Math.cos(b)*r*0.32,by+Math.sin(b)*r*0.32); } }
      g.stroke(); });
    g.lineCap='butt';
    g.fillStyle=th.snow_bright; g.beginPath(); g.arc(X,Y,r*0.2,0,Math.PI*2); g.fill();
  } else if(shape==='coin'){
    const sx=Math.abs(Math.cos(tick/14))*0.85+0.15;                       // spinning
    g.fillStyle=th.warm_deep; g.beginPath(); g.ellipse(X+S,Y+S,r*sx,r,0,0,Math.PI*2); g.fill();
    g.fillStyle=th.ansi_yellow; g.beginPath(); g.ellipse(X,Y,r*sx,r,0,0,Math.PI*2); g.fill(); outline();
    g.fillStyle=th.ansi_yellow_bright; g.beginPath(); g.ellipse(X,Y,r*0.68*sx,r*0.68,0,0,Math.PI*2); g.fill();
    if(sx>0.5){ g.fillStyle=th.warm_deep; g.font=`bold ${Math.round(r*0.9)}px ui-monospace, monospace`;
      g.textAlign='center'; g.fillText('\u2744',X,Y+r*0.32); g.textAlign='left'; }
    glint(-0.45*sx,-0.55,1.6);
  } else if(shape==='heart'){
    const beat=1+0.1*Math.max(0,Math.sin(tick/4)), R=r*beat;
    g.fillStyle=th.ansi_red_bright; g.beginPath();
    g.moveTo(X,Y+R*0.95);
    g.bezierCurveTo(X-R*1.25,Y+R*0.1,X-R*0.85,Y-R*0.95,X,Y-R*0.35);
    g.bezierCurveTo(X+R*0.85,Y-R*0.95,X+R*1.25,Y+R*0.1,X,Y+R*0.95);
    g.closePath(); g.fill(); outline();
    glint(-0.55,-0.45,2);
  } else {                                                    // crystal
    poly([[0,-1.1],[0.72,-0.25],[0.45,1],[-0.45,1],[-0.72,-0.25]],th.accent_warm);
    poly([[0,-1.1],[0.25,-0.25],[0,1],[-0.25,-0.25]],th.ansi_yellow_bright);  // facet
    g.strokeStyle=th.ansi_black; g.lineWidth=S*0.8; g.beginPath();
    g.moveTo(X-r*0.72,Y-r*0.25); g.lineTo(X+r*0.72,Y-r*0.25); g.stroke();
    glint(-0.35,-0.65,1.8);
  }
}
function chipButton(label,onClick){
  const b=document.createElement('button'); b.className='chip';
  b.textContent=label; b.addEventListener('click',onClick); return b;
}
// The free-text answer: an "Other" chip that opens a short field in place.
// onSubmit(text) gets the trimmed text; the server has the final say.
function otherChip(onSubmit){
  const wrap=document.createElement('span');
  wrap.style.cssText='display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap';
  const chip=chipButton(bonusCopy('other_label')||'Other',()=>{
    const inp=document.createElement('input');
    inp.type='text'; inp.className='lin'; inp.autocomplete='off';
    inp.maxLength=+(bonusCopy('other_max')||80);
    inp.placeholder=bonusCopy('other_placeholder')||'';
    inp.style.minWidth='200px';
    const ok=chipButton(bonusCopy('other_submit')||'OK',()=>{
      const t=inp.value.trim(); if(t.length<2){ inp.focus(); return; }
      // Same rule the server enforces, checked here so a refused answer is
      // caught before the card closes.
      if(/\S+@\S+\.\S+/.test(t) || /(\d[\s\-().]*){7,}/.test(t)){
        inp.value=''; inp.placeholder='No contact details, please'; inp.focus(); return;
      }
      onSubmit(t);
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ok.click(); } });
    wrap.replaceChildren(inp,ok); inp.focus();
  });
  wrap.appendChild(chip);
  return wrap;
}
function openBonus(){
  const o=bonusObj; if(!o) return;
  $('bq-head').textContent=bonusCopy('card_heading');
  $('bq-q').textContent=o.question;
  $('bq-hint').textContent=bonusCopy('card_hint');
  $('bq-skip').textContent=bonusCopy('skip');
  const box=$('bq-opts'); box.replaceChildren();
  (o.options||[]).forEach(opt=>box.appendChild(chipButton(opt,()=>answerBonus(opt))));
  box.appendChild(otherChip(t=>answerBonus(bonusCopy('other_label')||'Other',t)));
  Object.keys(keys).forEach(k=>keys[k]=false);        // stop the walk
  $('ov-bonus').classList.add('on');
}
async function answerBonus(opt,text){
  const o=bonusObj; if(!o || bonusBusy) return; bonusBusy=true;
  // Close and celebrate at once, with the expected value; the server's
  // answer then settles the real score. Waiting on the round trip first made
  // every collect feel sticky.
  const left=Math.max(0,Math.round(o.left)), guess=bonusPointsNow(), pt=boardPoint(o.x,o.y);
  bonusObj=null; $('ov-bonus').classList.remove('on');
  celebrateBonus(guess, pt, 0); burstAt(o.x,o.y);
  try{
    const r=await (await fetch('/api/bonus/answer',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:o.id,choice:opt,text:text||'',where:'map',left_ms:left})})).json();
    if(r.ok && r.score){ lastScore=r.score; countUp(r.score); }
    // A typed answer the server refused (contact details, too short): the
    // celebration already played, so say so rather than silently lose it.
    if(!r.ok && text) nudge(r.error||'',3200);
  }catch(e){}
  bonusBusy=false;
}
async function missBonus(timedOut){
  const o=bonusObj; if(!o || bonusBusy) return; bonusBusy=true;
  try{ await fetch('/api/bonus/miss',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})}); }
  catch(e){}
  bonusObj=null; bonusBusy=false; $('ov-bonus').classList.remove('on');
  nudge(bonusCopy('missed_toast'),3200);
}
function skipBonus(){ missBonus(false); }

// ---- score gratification ----
// A collected bonus should FEEL like points: a big number floats up from where
// it was won, a burst of sparks fires on the board, the score in the top bar
// counts up, and a progress line says how many are left.
let sparks=[];
function boardPoint(tx,ty){
  const cv=$('cv'), r=cv.getBoundingClientRect();
  return {x:r.left+((tx+0.5)*T*S/cv.width)*r.width,
          y:r.top+((ty+0.5)*T*S/cv.height)*r.height};
}
function burstAt(tx,ty){
  const X=tx*T*S+T*S/2, Y=ty*T*S+T*S/2;
  for(let i=0;i<28;i++){
    const a=Math.PI*2*i/28+Math.random()*0.3, v=2+Math.random()*4;
    sparks.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:1,
                 c:i%2?'accent_warm':'accent'});
  }
}
function drawSparks(g){
  if(!sparks.length) return;
  sparks.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.025;
    g.globalAlpha=Math.max(0,p.life); g.fillStyle=CFG.theme[p.c];
    g.fillRect(p.x-S,p.y-S,S*2,S*2); });
  g.globalAlpha=1; sparks=sparks.filter(p=>p.life>0);
}
function popText(text,pt,cls){
  const el=document.createElement('div'); el.className='scorepop'+(cls?' '+cls:'');
  el.textContent=text; el.style.left=pt.x+'px'; el.style.top=pt.y+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1700);
}
function countUp(to){
  const el=$('h-score'), from=+String(el.textContent).replace(/[^0-9]/g,'')||0;
  if(!(to>from)) return;
  const t0=performance.now(), dur=700;
  (function step(t){ const k=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))).toLocaleString();
    if(k<1) requestAnimationFrame(step); })(t0);
  el.animate([{transform:'scale(1)'},{transform:'scale(1.9)',color:'var(--warm)'},
              {transform:'scale(1)'}],{duration:800,easing:'ease-out'});
}
function celebrateBonus(points,pt,score){
  popText(bonusCopy('pop_text').replace('{points}',points),pt);
  const n=(((ST.bonus||{}).answered)||[]).length+1, max=BONUS().max_answered||5;
  setTimeout(()=>popText(bonusCopy('progress').replace('{n}',Math.min(n,max))
    .replace('{max}',max),{x:pt.x,y:pt.y+46},'small'),220);
  if(score){ lastScore=score; countUp(score); }
  GameAudio.playAchievement();
}

// Postbox catch-up. Optional; the CREATE button never waits on it.
function paintMissedBonus(d){
  const wrap=$('bp-bonus'), b=ST.bonus||{};
  // Only as many as there are bonus slots left: past the cap the server
  // rightly refuses them, and a tappable question that does nothing is worse
  // than not offering it.
  const left=Math.max(0,(BONUS().max_answered||5)-((b.answered||[]).length));
  const missed=(b.missed||[]).slice(0,left);
  if(!BONUS().enabled || d.queued || !missed.length){ wrap.style.display='none'; return; }
  wrap.replaceChildren();
  const h=document.createElement('h3'); h.textContent=bonusCopy('missed_heading');
  const hint=document.createElement('div'); hint.className='hint';
  hint.textContent=bonusCopy('missed_hint');
  wrap.append(h,hint);
  missed.forEach(m=>{
    const row=document.createElement('div'); row.style.margin='8px 0';
    const q=document.createElement('div'); q.style.fontSize='14px'; q.textContent=m.question;
    const opts=document.createElement('div'); opts.className='opts chips';
    const answer=async(opt,text)=>{
      opts.querySelectorAll('button,input').forEach(b=>b.disabled=true);
      try{
        const r=await (await fetch('/api/bonus/answer',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:m.id,choice:opt,text:text||'',where:'postbox'})})).json();
        if(r.ok){
          const rc=row.getBoundingClientRect();
          row.remove();
          celebrateBonus(r.points||((BONUS().scoring||{}).postbox)||0,
                         {x:rc.left+rc.width/2, y:rc.top+rc.height/2}, r.score);
          // Answering may have used the last slot: drop any rows now over the cap.
          if((((ST.bonus||{}).answered)||[]).length+1>=(BONUS().max_answered||5))
            wrap.querySelectorAll('.opts').forEach(o=>o.parentElement.remove());
        }
        else if(text){                  // typed answer refused: let them retry
          opts.querySelectorAll('button,input').forEach(b=>b.disabled=false);
          nudge(r.error||'',3200); return;
        }
        else row.remove();              // refused (e.g. cap reached): do not leave it tappable
      }catch(e){ opts.querySelectorAll('button,input').forEach(b=>b.disabled=false); }
      if(!wrap.querySelector('.opts')) wrap.style.display='none';
    };
    (m.options||[]).forEach(opt=>opts.appendChild(chipButton(opt,()=>answer(opt))));
    opts.appendChild(otherChip(t=>answer(bonusCopy('other_label')||'Other',t)));
    row.append(q,opts); wrap.appendChild(row);
  });
  wrap.style.display='';
}

// Scoreboard: today's top penguins on THIS account, read from SESSIONS by the
// server. If it cannot be read the visit simply carries on to the card.
async function showBoard(){
  if(!BONUS().enabled) return showDoneSummary();
  let d=null;
  try{ const r=await fetch('/api/scoreboard',{cache:'no-store'}); if(r.ok) d=await r.json(); }
  catch(e){}
  if(!d || !d.ok) return showDoneSummary();
  $('sb-title').textContent=bonusCopy('scoreboard_title');
  const ol=$('sb-list'); ol.replaceChildren();
  (d.top||[]).forEach(row=>{
    const li=document.createElement('li');
    li.textContent=row.name+' \u2014 '+(+row.score).toLocaleString();
    if(row.you){ li.style.color='var(--warm)'; li.style.fontWeight='700'; }
    ol.appendChild(li);
  });
  const sc=(+d.score||+ST.score||0).toLocaleString();
  $('sb-rank').textContent=(d.rank?bonusCopy('scoreboard_rank').replace('{rank}',d.rank)
    :bonusCopy('scoreboard_unranked')).replace('{score}',sc);
  $('sb-go').textContent=bonusCopy('scoreboard_button');
  $('ov-board').classList.add('on');
}

async function submitPanel(){
  const id=panelLoc, l=CFG.locations[id]||{}; if(!id) return;
  // In a POV location, once CoCo has replied the button becomes "leave" and
  // just closes the desk scene.
  if(isPov(id) && inScenePhase==='reply'){ visited.add(id); closePanel(); return; }
  histIdx=null;
  try{
    if(l.mode==='checklist'){
      const items=OPTS[id]||[];
      const labels=[...sel].map(i=>items[i]&&items[i].label).filter(Boolean);
      const other=$('c-other').value.trim(); if(other) labels.push(other);
      if(!labels.length) return;
      await post('/api/select',{location:id,labels});
    } else if(l.mode==='compose'){
      const text=$('c-compose').value.trim(); if(!text) return;
      await post('/api/compose',{text});
    } else {
      await post('/api/send',{});
    }
    if(isPov(id)){
      // Stay at the desk: CoCo answers in-scene rather than in the top bubble.
      inSceneLoc=id; inScenePhase='await'; runStart=Date.now();
      const say=$('c-say'); say.classList.add('on');
      say.innerHTML='<b>CoCo</b>Let me look that up for you\u2026';
      $('c-opts').style.display='none'; $('c-otherwrap').style.display='none';
      // LET COCO CHOOSE is an offer to answer FOR them. Once they have answered
      // themselves the offer is spent, and leaving it on screen above their own
      // words read as though their answer had not registered. It is restored
      // when the bench is next opened (see the display reset in openPanel).
      $('c-coco-choose').style.display='none';
      $('c-go').disabled=true; $('c-go').textContent='THINKING\u2026';
    } else {
      visited.add(id); closePanel();
    }
  }catch(e){ showErr('cannot reach server'); }
}
$('c-coco-choose').addEventListener('click',()=>{
  // One shot. It stayed live after being pressed, so it invited a second click
  // that would overwrite the answer CoCo was already composing.
  if($('c-coco-choose').disabled) return;
  $('c-coco-choose').disabled=true;
  const v=ST.visitor||{};
  // This text fills ONE slot in the workshop prompt - {input}, "the POC should
  // ...". The prompt already carries first_name, company, industry, the problem,
  // what they hold, what they are joining and the whitelist of Snowflake
  // features, so repeating that context here would only make the sentence they
  // see in the box longer and more robotic, not make CoCo better informed.
  // What it SHOULD carry is the one thing the prompt cannot infer: the shape of
  // the ask. So lead with the problem they typed, because that is the most
  // specific thing they have said, and fall back to their data when they left it
  // blank.
  // The industry is deliberately not named. It was, and a visitor who picked
  // "Something else" - a real option - read "Build the most impactful thing for
  // Something else", which reads like a bug. The server sees their sector either
  // way.
  const problem=(v.problem||'').trim().replace(/\s+/g,' ').replace(/[.\s]+$/,'');
  const held=(ST.held||[]).slice(0,2).join(' and ');
  const joined=(ST.joined||[]).slice(0,1)[0]||'';
  const tail=[held?'using '+held:'',joined?'joined with '+joined:'']
    .filter(Boolean).join(', ');
  const text=(problem?'Solve this: '+problem+'. ':'')
    +'Build the most impactful thing'
    +(tail?' '+tail:' with the data I hold')+'.'
    // What they told CoCo on the map, each as "topic: answer" (falling back to
    // the question when no topic was recorded), so the brief carries what the
    // answer was ABOUT, not a bare "Daily".
    +(()=>{ const a=(((ST.bonus||{}).answered)||[]).filter(x=>x.answer)
              .map(x=>{ const t=String(x.topic||x.question||'').replace(/[?.\s]+$/,'');
                        return t?t.charAt(0).toUpperCase()+t.slice(1)+': '+x.answer:x.answer; });
            return a.length?' '+bonusCopy('brief_prefix')+' '+a.join('; ')+'.':''; })();
  $('c-compose').value=text;
  submitPanel();
});

// While a POV desk is open and awaiting CoCo, surface the reply in-scene.
function paintScenePanel(s){
  if(!panelOpen || !isPov(panelLoc) || inScenePhase!=='await') return;
  const say=$('c-say');
  if(s.thinking){
    const last=(s.reasoning||[]).slice(-1)[0]||'Processing your request\u2026';
    say.innerHTML='<b>CoCo</b>'+esc(last);
  } else if(s.reply){
    inScenePhase='reply'; visited.add(panelLoc);
    say.innerHTML='<b>CoCo</b>'+esc(s.reply);
    const leave = {library:'LEAVE THE LIBRARY', marketplace:'LEAVE THE STALL',
                   workshop:'LEAVE THE WORKSHOP'}[panelLoc] || 'STEP AWAY';
    $('c-go').disabled=false; $('c-go').textContent=leave;
    $('c-go').classList.add('leave-cta');
    // Walk them back out. Standing in a finished room waiting to be told to
    // leave is dead time on a five minute budget, and the reply is not lost:
    // paintBubble adopts it in the top thought bubble on the way out.
    startAutoLeave();
  }
}

let autoLeaveT=0;
// Feedback from the floor: 3s was not enough to read a real reply, only a
// short one. 8s is long enough for the ~40 word replies this stop actually
// produces, with the leave-cta pulse above doing the job of pulling a visitor
// who reads faster than that back to the button rather than making them wait.
const AUTO_LEAVE_MS=8000;
function startAutoLeave(){
  clearTimeout(autoLeaveT);
  const at=panelLoc;
  autoLeaveT=setTimeout(()=>{
    if(!panelOpen || panelLoc!==at || inScenePhase!=='reply') return;
    visited.add(at); closePanel();
  },AUTO_LEAVE_MS);
}
function cancelAutoLeave(){ clearTimeout(autoLeaveT); autoLeaveT=0; }

// ---------------- the shareable card ----------------
// A visitor leaves with a document nobody else sees. This is the other half:
// one 1200x630 pixel-art image, sized for a LinkedIn post, showing CoCo standing
// in a scene that matches the POC they designed.
//
// It is drawn, not generated. There is no image model in the loop, no latency and
// no cost: every archetype has a precomputed palette and a motif, and the card is
// those parts assembled with the visitor's own words on top. That is the whole
// trick - the decision tree already tells us the finite set of things a visitor
// can end up with, so the art can be built in advance and pieced together.
const CARD_W=1200, CARD_H=630;
// Every card now sits on the same dark grey, #2C3444, lifting one step to
// Clear Dark's #35424C so a 1200x630 slab is not a flat field. The nine
// identities survive in the accent alone, and every accent is drawn from the
// Clear Dark palette rather than invented, so a wall of nine postcards reads as
// one family. They were nine bespoke gradients - purple, pink, teal - none of
// which were brand colours.
const CARD_SKY=['#2C3444','#35424C'];
const CARD_THEMES={
  'talk-to-my-data':        {sky:CARD_SKY, accent:'#29B5E8', motif:'chart',    tag:'Talk to my data'},
  'ask-my-documents':       {sky:CARD_SKY, accent:'#67B5ED', motif:'docs',     tag:'Ask my documents'},
  'extract-from-paperwork': {sky:CARD_SKY, accent:'#D389E5', motif:'form',     tag:'Extract from paperwork'},
  'triage-and-classify':    {sky:CARD_SKY, accent:'#79BE7E', motif:'bins',     tag:'Triage and classify'},
  'an-agent-that-acts':     {sky:CARD_SKY, accent:'#BD7BCD', motif:'agent',    tag:'An agent that acts'},
  'predict-what-happens-next':{sky:CARD_SKY, accent:'#E5C872', motif:'trend',  tag:'Predict what happens next'},
  'join-the-silos':         {sky:CARD_SKY, accent:'#6D96B4', motif:'silos',    tag:'Join the silos'},
  'share-without-copying':  {sky:CARD_SKY, accent:'#6CAA71', motif:'share',    tag:'Share without copying'},
  'watch-it-live':          {sky:CARD_SKY, accent:'#84DDE0', motif:'stream',   tag:'Watch it live'}
};
// Per-motif vertical nudge, so every motif's visual bottom lands on the same
// ground plane as CoCo's feet. Measured, not guessed.
const MOTIF_LIFT={chat:34,docs:-6,form:-14,bins:-18,agent:26,chart:-10,
                  trend:-14,silos:-8,share:2,stream:6};
function cardTheme(){
  const a=(ST.poc||{}).archetype||'';
  return CARD_THEMES[a]||CARD_THEMES['talk-to-my-data'];
}
// One pixel unit for the card, so everything stays on a grid and reads as sprite
// art rather than as smooth vector shapes shrunk down.
function cpx(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

function drawCardMotif(g,kind,cx,cy,u,accent){
  const A=accent, D='#E5EFF5', S2='rgba(255,255,255,.20)';
  if(kind==='chat'){
    // iMessage-style: user asks (accent, left), reply (white, right)
    const msgs=[
      {w:7, h:2.5, side:'l', c:A},
      {w:8, h:2.5, side:'r', c:D},
      {w:8, h:2.5, side:'l', c:A},
      {w:7, h:2.5, side:'r', c:D},
    ];
    let ty=cy+u*5;
    for(const m of msgs){
      ty-=m.h*u+u*1.3;
      const bx=m.side==='r'? cx+u*1 : cx-m.w*u-u*1;
      cpx(g,bx,ty,m.w*u,m.h*u,m.c);
      // tail
      if(m.side==='r') cpx(g,bx+m.w*u-u*0.5,ty+m.h*u,u*1.3,u*0.8,m.c);
      else cpx(g,bx,ty+m.h*u,u*1.3,u*0.8,m.c);
      // text line
      const lc=m.c===A?'rgba(255,255,255,.5)':'rgba(0,0,0,.25)';
      cpx(g,bx+u*1.2,ty+m.h*u/2-u*0.3,m.w*u-u*2.5,u*0.7,lc);
    }
    // table icon, positioned fully clear to the right of the bubble stack
    const tx=cx+u*12, tby=cy-u*6;
    cpx(g,tx,tby,u*6,u*5.5,D);          // table body
    cpx(g,tx,tby,u*6,u*1.3,A);          // header row
    cpx(g,tx+u*2.8,tby+u*1.3,u*0.6,u*4.2,'rgba(0,0,0,.15)'); // col divider
    cpx(g,tx,tby+u*2.8,u*6,u*0.4,'rgba(0,0,0,.12)');  // row divider
    cpx(g,tx,tby+u*4.2,u*6,u*0.4,'rgba(0,0,0,.12)');  // row divider
  } else if(kind==='docs'){
    // Stack of 3 offset pages with correctly centred text lines
    for(let i=0;i<3;i++){
      const px=cx-u*4.5+i*u*1.5, py=cy-u*5+i*u*2;
      cpx(g,px,py,u*10,u*13,i===2?A:D);
    }
    // text lines on front page, centred within it
    const fx=cx-u*4.5+u*3+u*1.5, fy=cy-u*5+u*4+u*2;
    for(let r=0;r<5;r++) cpx(g,fx,fy+r*u*1.8,u*6,u*0.8,'rgba(0,0,0,.35)');
  } else if(kind==='form'){
    cpx(g,cx-u*6,cy-u*8,u*12,u*15,D);
    for(let r=0;r<5;r++){ cpx(g,cx-u*4,cy-u*6+r*u*2.6,u*2,u*2,A);
      cpx(g,cx-u*1,cy-u*5.6+r*u*2.6,u*5,u*1.2,'rgba(0,0,0,.35)'); }
  } else if(kind==='bins'){
    // Three sorting bins (trays) with items falling into them
    for(let i=0;i<3;i++){
      const bx=cx-u*9+i*u*7;
      // bin body (open top)
      cpx(g,bx,cy-u*1,u*5,u*8,i===1?A:D);
      cpx(g,bx-u*0.5,cy-u*2,u*6,u*1.5,i===1?A:D); // rim
      // item inside bin
      cpx(g,bx+u*1,cy+u*2,u*3,u*2,S2);
    }
    // falling items above bins
    cpx(g,cx-u*7,cy-u*6,u*2.5,u*2.5,S2);
    cpx(g,cx-u*0.5,cy-u*8,u*2.5,u*2.5,A);
    cpx(g,cx+u*6,cy-u*5,u*2.5,u*2.5,S2);
    // dotted arrows above
    cpx(g,cx-u*6.5,cy-u*4,u*0.8,u*1.5,S2);
    cpx(g,cx,cy-u*5.5,u*0.8,u*1.5,A);
    cpx(g,cx+u*6.5,cy-u*3.5,u*0.8,u*1.5,S2);
  } else if(kind==='agent'){
    cpx(g,cx-u*5,cy-u*6,u*10,u*9,D); cpx(g,cx-u*3,cy-u*4,u*2.5,u*2.5,A);
    cpx(g,cx+u*0.5,cy-u*4,u*2.5,u*2.5,A);
    cpx(g,cx-u*2,cy+u*1,u*4,u*1.2,'rgba(0,0,0,.4)');
    cpx(g,cx-u*0.6,cy-u*9,u*1.2,u*3,D); cpx(g,cx-u*2,cy-u*11,u*4,u*2,A);
  } else if(kind==='chart'){
    // Bar chart (compact, lower) with speech bubble clearly above
    [4,7,5,9,6].forEach((h,i)=>cpx(g,cx-u*8+i*u*3.5,cy+u*6-h*u,u*2.8,h*u,i===3?A:D));
    // speech bubble well above the bars
    cpx(g,cx-u*5,cy-u*13,u*12,u*5.5,A);
    cpx(g,cx-u*1,cy-u*7.5,u*2,u*1.8,A); // tail pointing down
    // text lines inside bubble
    cpx(g,cx-u*3.5,cy-u*12,u*8,u*0.8,'rgba(0,0,0,.3)');
    cpx(g,cx-u*3.5,cy-u*10.5,u*6,u*0.8,'rgba(0,0,0,.3)');
  } else if(kind==='trend'){
    // Bars in subtle green, dot-line in Clear Dark magenta (not orange) to
    // avoid a cigarette look
    const G='rgba(108,170,113,.55)', PK='#D389E5';
    for(let i=0;i<7;i++){
      const h=(3+i*1.4)*u;
      cpx(g,cx-u*10+i*u*3,cy+u*6-h,u*2.2,h,i>4?PK:G);
    }
    for(let i=0;i<7;i++){
      const nx=cx-u*10+i*u*3, ny=cy+u*6-(3+i*1.4)*u-u*2.4;
      cpx(g,nx,ny,u*2.2,u*2.2,i>4?PK:D);
      if(i<6) cpx(g,nx+u*2.2,ny-u*0.8,u*0.9,u*2.4,i>3?PK:D);
    }
    cpx(g,cx-u*11,cy+u*6,u*24,u*0.9,D);
  } else if(kind==='silos'){
    // Three silos with connecting bridges between them showing JOIN
    for(let i=0;i<3;i++){
      const bx=cx-u*10+i*u*8;
      const col=i===1?A:D;
      // silo body
      cpx(g,bx,cy-u*4,u*5,u*10,col);
      // dome top
      cpx(g,bx+u*0.5,cy-u*6,u*4,u*2.5,col);
      cpx(g,bx+u*1,cy-u*7.5,u*3,u*2,col);
      cpx(g,bx+u*1.8,cy-u*8.5,u*1.4,u*1.5,col);
    }
    // horizontal bridges connecting silos (the JOIN)
    cpx(g,cx-u*5,cy-u*1,u*4,u*1.5,A);
    cpx(g,cx+u*3,cy-u*1,u*4,u*1.5,A);
    // arrows on bridges pointing both ways
    cpx(g,cx-u*5.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx-u*1.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx+u*2.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx+u*6.5,cy-u*2,u*1.2,u*3.5,A);
    // data flowing through bridges (small squares)
    cpx(g,cx-u*4,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx-u*2.5,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx+u*4,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx+u*5.5,cy-u*0.5,u*1,u*1,D);
  } else if(kind==='share'){
    // Two people/screens with a glowing link between them - fun and playful
    // Left screen
    cpx(g,cx-u*12,cy-u*5,u*8,u*10,D);
    cpx(g,cx-u*11,cy-u*4,u*6,u*8,'#191D27');
    // data bars on left screen
    cpx(g,cx-u*10,cy-u*2,u*4,u*0.8,S2);
    cpx(g,cx-u*10,cy-u*0.2,u*3,u*0.8,S2);
    cpx(g,cx-u*10,cy+u*1.6,u*4.5,u*0.8,A);
    // Right screen (mirror)
    cpx(g,cx+u*5,cy-u*5,u*8,u*10,A);
    cpx(g,cx+u*6,cy-u*4,u*6,u*8,'#191D27');
    // same data bars on right screen (it's shared!)
    cpx(g,cx+u*7,cy-u*2,u*4,u*0.8,S2);
    cpx(g,cx+u*7,cy-u*0.2,u*3,u*0.8,S2);
    cpx(g,cx+u*7,cy+u*1.6,u*4.5,u*0.8,D);
    // glowing link arc between them
    for(let i=0;i<5;i++){
      const px=cx-u*3.5+i*u*2, py=cy-u*2-Math.sin(i/4*Math.PI)*u*3;
      cpx(g,px,py,u*1.4,u*1.4,A);
    }
    // sparkle bursts
    cpx(g,cx-u*1,cy-u*7,u*1.2,u*1.2,A);
    cpx(g,cx+u*2,cy-u*6.5,u*0.9,u*0.9,D);
    cpx(g,cx+u*0.5,cy-u*8.5,u*0.9,u*0.9,A);
  } else if(kind==='stream'){
    // Was eight scattered squares beside a bare bar, which read as a rendering
    // glitch rather than as a stream. It needs an object: a monitor with a live
    // trace running across it, and a queue feeding in from the left.
    cpx(g,cx-u*11,cy-u*8,u*22,u*15,D);                  // bezel
    cpx(g,cx-u*10,cy-u*7,u*20,u*13,'#191D27');          // screen
    for(let i=0;i<19;i++){                              // the trace
      const yy=cy-u*0.5+Math.sin(i*0.8)*u*4.2;
      cpx(g,cx-u*10+i*u,yy,u*1.1,u*1.1,i>14?A:D);
    }
    cpx(g,cx-u*10,cy+u*4.6,u*20,u*0.8,'rgba(255,255,255,.18)');
    for(let i=0;i<4;i++)                                // queue feeding in
      cpx(g,cx-u*15+i*u*1.6,cy-u*1+((i%2)?-u:u),u*1.3,u*1.3,A);
    cpx(g,cx-u*4,cy+u*7,u*8,u*3,D);                     // stand
  }
}

function wrapText(g,text,maxW){
  const words=String(text||'').split(/\s+/).filter(Boolean), lines=[];
  let cur='';
  words.forEach(wd=>{
    const t=cur?cur+' '+wd:wd;
    if(g.measureText(t).width>maxW && cur){ lines.push(cur); cur=wd; } else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}

function buildShareCard(){
  const cv=document.createElement('canvas');
  cv.width=CARD_W; cv.height=CARD_H;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  const th=cardTheme(), v=ST.visitor||{}, poc=ST.poc||{};

  // sky
  const sky=g.createLinearGradient(0,0,0,CARD_H);
  sky.addColorStop(0,th.sky[0]); sky.addColorStop(1,th.sky[1]);
  g.fillStyle=sky; g.fillRect(0,0,CARD_W,CARD_H);
  // stars, on a grid so they stay pixels
  for(let i=0;i<90;i++){
    const x=(i*137)%CARD_W, y=(i*61)%Math.round(CARD_H*0.55);
    cpx(g,x,y,3,3,i%4?'rgba(255,255,255,.30)':'rgba(255,255,255,.65)');
  }
  // ground: two bands of snow
  const GR=Math.round(CARD_H*0.64);
  cpx(g,0,GR,CARD_W,CARD_H-GR,'#DEE5EB');
  cpx(g,0,GR,CARD_W,10,'#E5EFF5');
  cpx(g,0,GR+56,CARD_W,6,'rgba(41,181,232,.20)');

  // the motif stands to CoCo's right, at POC scale
  // Motifs are anchored to the ground rather than to a fixed offset: measured
  // bottoms varied by 50px across the ten, so 'agent' floated in the sky while
  // 'docs' sat on the snow. MOTIF_LIFT lands each one on the same plane.
  const lift=MOTIF_LIFT[th.motif]||0;
  drawCardMotif(g,th.motif,Math.round(CARD_W*0.775),GR-40-lift,11,th.accent);
  // CoCo himself, reusing the in-game sprite so the card and the game agree.
  // The card is a portrait, so it takes the CLI pose EXACTLY - feet sitting
  // inside the body. Only the game needs them below, to walk.
  drawCoCoFront(g,Math.round(CARD_W*0.545),GR+22,9,{sitting:true});

  // text column
  const PADX=64;
  g.textBaseline='top';
  g.fillStyle=th.accent;
  g.font='700 22px ui-monospace,SFMono-Regular,Menlo,monospace';
  g.fillText(th.tag.toUpperCase(),PADX,64);

  g.fillStyle='#E5EFF5';
  g.font='700 52px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const lines=wrapText(g,poc.poc_name||'My Snowflake proof of concept',
                       Math.round(CARD_W*0.44));
  lines.slice(0,3).forEach((ln,i)=>g.fillText(ln,PADX,104+i*58));

  let y=104+Math.min(lines.length,3)*58+16;
  g.fillStyle='rgba(255,255,255,.80)';
  g.font='400 24px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const feats=(poc.features||[]).slice(0,3).join('  |  ');
  if(feats) g.fillText(feats,PADX,y);

  // footer strip: who, where, how long. The time is the boast.
  const FOOTER_H=92;
  cpx(g,0,CARD_H-FOOTER_H,CARD_W,FOOTER_H,'rgba(25,29,39,.88)');
  g.fillStyle='#E5EFF5';
  g.font='700 26px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const el=Math.max(0,Math.round(Date.now()/1000-(ST.started_at||Date.now()/1000)));
  const mm=Math.floor(el/60), ss=el%60;
  g.fillText('Built in '+mm+':'+String(ss).padStart(2,'0')+' with Cortex Code'
             +(ST.score?'  \u00b7  '+bonusCopy('card_score').replace('{score}',ST.score):''),
             PADX,CARD_H-66);
  g.fillStyle='rgba(255,255,255,.62)';
  g.font='400 20px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const city=((CFG.event||{}).city)||'';
  const evName=String((CFG.event||{}).event_name||'').trim()||('Snowflake World Tour '+city);
  g.fillText((v.first_name||'A visitor')+' at '+evName,
             PADX,CARD_H-34);

  // The mark, bottom right. The full wordmark rather than the symbol alone: this
  // image is going onto someone's LinkedIn feed, where a bare symbol at 30px is
  // just a blue blob and the word is the whole point of them posting it. White
  // on the dark footer strip now, to sit on that panel rather than fight it.
  //
  // Sized to the STRIP, not to a fixed width: the old file's aspect (3840x919)
  // was fatter than this one's (1585x362), so a fixed lw=286 left this logo's
  // height too tall for the 92px strip and its top edge spilled up into the
  // card body above. Deriving lh from the strip height with a real margin on
  // both sides keeps it inside the strip regardless of which file is loaded.
  const LOGO_MARGIN=20;
  const lh=FOOTER_H-LOGO_MARGIN*2, lw=Math.round(lh*1585/362);
  if(!drawImgSmooth(g,'wordmark',CARD_W-lw-46,CARD_H-FOOTER_H+LOGO_MARGIN,lw,lh)){
    // The card can be built the instant the page loads, before the asset has
    // arrived. A missing logo must not cost the visitor their card.
    g.fillStyle='#E5EFF5'; g.font='700 34px ui-sans-serif,system-ui,sans-serif';
    g.textAlign='right'; g.fillText('snowflake',CARD_W-46,CARD_H-44);
    g.textAlign='left';
  }
  return cv;
}

// Stage the card and show a QR for it. Failure is not fatal: the visitor still
// has their blueprint QR, and the operator can fall back to the copy button.
async function handoverCard(dataUrl){
  const hint=$('done-cardhint');
  try{
    // post() resolves to the fetch Response, NOT the parsed body. Reading
    // r.url off it gave the REQUEST url, so the QR encoded
    // http://127.0.0.1:4747/api/card - a booth laptop address, on a stranger's
    // phone, which of course did nothing.
    const res=await post('/api/card',{png:dataUrl});
    const r=await res.json();
    if(!r || !r.url) throw new Error((r && r.error) || 'no url');
    const qr=$('done-qr');
    qr.onerror=()=>{ hint.textContent='Card staged, but the QR could not be '
      +'drawn. Ask us for the link.'; };
    qr.src='/api/qr?u='+encodeURIComponent(r.url);
    $('done-hand').style.display='flex';
    hint.style.display='none';
  }catch(e){
    hint.textContent='Your card is on screen, but we could not put it on a code.'
      +' Ask us and we will send it with your plan.';
  }
}

// Reveal the second library question once the first has an answer. Called from
// the option toggles and from the free-text box, so either route unlocks it.
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) showErr('rejected: '+(await r.text()).slice(0,90)); else showErr('');
  return r;
}
