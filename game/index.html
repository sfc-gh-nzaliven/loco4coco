let trayOpen=false, thinkSince=0, bpShown=false;
$('trayhead').addEventListener('click',()=>{
  trayOpen=!trayOpen;
  $('traybody').classList.toggle('on',trayOpen);
  $('traychev').innerHTML = trayOpen?'HIDE WORK &#9652;':'SHOW WORK &#9662;';
  // The open tray body adds height the fixed chrome budget excludes, so re-fit
  // to keep its scrollable 132px inside the viewport.
  fitCanvas();
});
function paintTray(s){
  const lines=s.reasoning||[];
  // Honesty rule: the tray exists to show CoCo's REAL reasoning. The fast
  // (non-agentic) turns have none, so the tray is hidden for them rather than
  // filled with a decorative spinner. It belongs to the exec turns only.
  const agentic = (s.transport||'exec')==='exec';
  // visibility, not display: hiding the box entirely collapsed the chrome and
  // shifted the board mid-turn. The slot stays, the content goes.
  $('tray').style.visibility = agentic ? '' : 'hidden';
  if(!agentic){ thinkSince=0; return; }
  $('trayhead').classList.toggle('live',!!s.thinking);
  if(s.thinking && !thinkSince) thinkSince=Date.now();
  if(!s.thinking) thinkSince=0;
  const last=lines.length?lines[lines.length-1]:'';
  if(s.thinking){
    // A truthful elapsed counter, because the first real reasoning line can be
    // 30 seconds away and a frozen label reads as a hang.
    const secs=thinkSince?Math.floor((Date.now()-thinkSince)/1000):0;
    $('traynow').textContent=(last||'CoCo is working this out...')+`  (${secs}s)`;
  } else {
    $('traynow').textContent = lines.length?`Done \u00b7 ${lines.length} steps`:'Idle';
  }
  if(trayOpen){
    const b=$('traybody');
    if(b.dataset.n!==String(lines.length)){
      b.dataset.n=String(lines.length);
      b.innerHTML=lines.map(l=>`<div>${esc(l)}</div>`).join('');
      b.scrollTop=b.scrollHeight;
    }
  }
}

// ---------------- history ----------------
// The scroll-back history is the opening monologue (oldest) followed by each
// recorded stop. Opening beats have no "You said" - they are CoCo talking.
function histList(){
  const turns=(ST.turns||[]).map(t=>({reply:t.reply, text:t.text}));
  return openingLog.concat(turns);
}
function stepHist(d){
  const n=histList().length; if(!n) return;
  if(histIdx===null) histIdx = d<0 ? n-1 : null;
  else { histIdx+=d; if(histIdx>=n||histIdx<0) histIdx=null; }
  paintBubble(ST);
}
$('h-prev').addEventListener('click',()=>stepHist(-1));
$('h-next').addEventListener('click',()=>stepHist(1));

function paintBubble(s){
  const H=histList(), n=H.length;
  const turns=s.turns||[];
  $('h-prev').disabled = n===0 || histIdx===0;
  $('h-next').disabled = histIdx===null;
  $('h-at').textContent = n? (histIdx===null?`now \u00b7 ${n}`:`${histIdx+1} / ${n}`) : '';
  $('histback').classList.toggle('on',histIdx!==null);

  if(nudgeUntil>Date.now()){ setMessage(nudgeMsg); $('yousaid').classList.remove('on'); return; }

  // While a POV desk is open, CoCo speaks in-scene only. Mirroring the reply up
  // here as well was the repetition: the same words in the bubble, in #c-say,
  // and echoed again by "You said" over a panel that already shows the choice.
  if(panelOpen && isPov(panelLoc) && histIdx===null){
    $('yousaid').classList.remove('on');
    const l=CFG.locations[panelLoc]||{};
    setMessage(l.narrative?fillCli(l.narrative,s):'');
    return;
  }

  let msg, said='';
  if(histIdx!==null && H[histIdx]){
    msg=H[histIdx].reply; said=H[histIdx].text;
  } else if(s.thinking){
    msg=msgSource || 'Let me think about that...';
  } else if(s.reply){
    msg=s.reply; const t=turns[turns.length-1]; said=t?t.text:'';
  } else {
    // Only an UNLOCKED location may narrate. The penguin starts on the postbox
    // tile, so without this a fresh 0/4 session opened with the closing line.
    // And the movement hint is gated on the map actually being live: it was
    // firing throughout the house stage, telling a visitor to walk around with
    // WASD while they still had no control of anything.
    const l=(nearId&&unlocked(nearId))?CFG.locations[nearId]:null;
    const onMap = !openingActive();
    msg = l&&l.narrative ? fillCli(l.narrative,s)
        : (haveVisitor() && onMap
            ? `Use WASD or the arrows, ${esc((s.visitor||{}).first_name)}. Walk up to a place and press E.`
            : (onMap ? 'Press E when you reach somewhere interesting.' : ''));
  }
  $('yousaid').classList.toggle('on',!!said);
  if(said) $('yousaid').textContent='You said: '+said;
  setMessage(msg||'', histIdx!==null);
}
function fillCli(t,s){
  const v=s.visitor||{};
  return t.replace(/\{first_name\}/g,v.first_name||'there')
          .replace(/\{company\}/g,v.company||'your organisation')
          .replace(/\{email\}/g,v.email||'you');
}

// ---------------- state ----------------
function onState(s){
  const firstLoad = !ST.updated_at;
  ST=s;
  bonusOnState(s);
  // A background workshop draft counts as visited: the visitor has been sent
  // on, so the route cue must point at the postbox, not back at the bench.
  if(s.workshop_pending) visited.add('workshop');
  (s.turns||[]).forEach(t=>visited.add(t.location));
  $('h-col').textContent=`${visited.size} / ${Object.keys(CFG.locations).length}`;
  if(s.started_at && haveVisitor()){
    // Counts UP, not down: the clock is there to create a little urgency, not
    // to threaten a cliff. It keeps counting past the limit, and the one-time
    // notice at the limit is a soft nudge the visitor can dismiss.
    const elapsed=Date.now()/1000-s.started_at;
    const limit=CFG.event.time_limit_seconds||300;
    $('h-time').textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;
    $('h-time').style.color=elapsed>=limit?'#ED8D30':'';
    if(elapsed>=limit && !overNudged && s.stage!=='done'){ overNudged=true;
      nudge('That is five minutes - no rush, but let us get your present in the post when you are ready. (tap to dismiss)',6000); }
  } else { $('h-time').textContent='0:00'; }
  const ids=Object.keys(CFG.locations), bar=$('stagebar');
  if(bar.children.length!==ids.length) bar.innerHTML=ids.map(()=>'<div></div>').join('');
  [...bar.children].forEach((d,i)=>{
    d.className = visited.has(ids[i])?'on':(nearId===ids[i]?'cur':''); });
  paintHudJourney();

  const opening = $('ov-title').classList.contains('on')
    || $('ov-arctic').classList.contains('on') || $('ov-letter').classList.contains('on')
    || $('ov-home').classList.contains('on')
    || openingActive();
  // Any stage past the attract screen means a visit is under way - latch the
  // title card shut even if we never saw the START click (operator reload,
  // resumed session), so a later state blip cannot bring it back.
  if((s.stage||'') && s.stage!=='attract') titleDone=true;
  $('banner').classList.toggle('on', !haveVisitor() && !opening);
  if(!titleDone && !haveVisitor() && !opening && firstLoad) openTitle();
  sceneThinking = !!s.thinking;
  paintTray(s);
  paintBubble(s);
  paintScenePanel(s);
}

$('a-text').addEventListener('keydown',e=>{ if(e.key==='Enter') $('a-go').click(); });

// A reply longer than the bubble's four-line ceiling is PAGINATED, not scrolled
// and not truncated: the visitor reads four lines, presses MORE, and the next
// four arrive in the same box. The box therefore never changes height, which is
// the invariant chromeBudget() depends on (it reserves the four-line worst case
// so the board is sized once and never re-fitted mid-turn).
//
// msgSource is the WHOLE reply; typeTarget is only the page being typed. The
// early return compares against msgSource, because poll() re-sends the same
// reply every tick and comparing against typeTarget would match page 1 and
// silently discard the rest.
let msgSource='',pages=[''],pageI=0,typeTarget='',typeI=0;

// Chars-per-line cannot be assumed: the rail is fluid, so 99 holds only at the
// full 1056px. Measure the real font against the real box width instead.
function splitPages(m){
  const el=$('d-msg');
  const w=el?el.clientWidth:0;
  if(!m) return [''];
  if(!w) return [m];          // not laid out yet - one page, re-split on resize
  const cs=getComputedStyle(el);
  const c=document.createElement('canvas').getContext('2d');
  c.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const fits=s=>c.measureText(s).width<=w;
  const lines=[];
  // white-space:pre-wrap, so an explicit newline is a real line break.
  for(const para of String(m).split('\n')){
    if(!para){ lines.push(''); continue; }
    let line='';
    for(let word of para.split(/(\s+)/)){
      if(!word) continue;
      // overflow-wrap:anywhere - a single unbreakable token is split by char.
      while(!fits(word) && word.length>1){
        let i=1; while(i<word.length && fits(word.slice(0,i+1))) i++;
        lines.push((line+word.slice(0,i)).trimEnd()||word.slice(0,i));
        word=word.slice(i); line='';
      }
      if(fits(line+word)) line+=word;
      else { lines.push(line.trimEnd()); line=word.trimStart(); }
    }
    lines.push(line.trimEnd());
  }
  const out=[];
  for(let i=0;i<lines.length;i+=BUBBLE_MAX_LINES)
    out.push(lines.slice(i,i+BUBBLE_MAX_LINES).join('\n'));
  return out.length?out:[''];
}

function renderMore(){
  const b=$('d-more'); if(!b) return;
  const many=pages.length>1, last=pageI>=pages.length-1;
  b.classList.toggle('on',many);
  // Tappable only while there is somewhere to go, so the last page cannot be
  // clicked into nothing.
  b.classList.toggle('tappable',many&&!last);
  // Reads as progress AND offers the shortcut: the visitor is told more is coming,
  // it arrives on its own, and TAP TO SKIP is there for anyone who reads faster
  // than the timer. A booth visitor should never HAVE to find a button to finish
  // a sentence, but they should be able to.
  b.textContent = many
    ? (last ? `${pageI+1} / ${pages.length}`
            : `${pageI+1} / ${pages.length}   \u00b7   TAP TO SKIP AHEAD  \u25b8`)
    : '';
}

// Pages advance THEMSELVES once the page has finished typing, after a pause long
// enough to read what is on screen. Timed from the page's own length rather than
// a flat delay, because a four-line page and a half-line page are not the same
// read. Clamped at both ends: never so brief it snatches the text away, never so
// long it stalls a five-minute visit.
let pageTimer=null;
function clearPageTimer(){ if(pageTimer){ clearTimeout(pageTimer); pageTimer=null; } }
function scheduleNextPage(){
  clearPageTimer();
  if(pageI>=pages.length-1) return;
  const chars=(pages[pageI]||'').length;
  const ms=Math.min(9000,Math.max(2600,Math.round(chars*42)));
  pageTimer=setTimeout(()=>{ pageTimer=null; showPage(pageI+1); },ms);
}

function showPage(i,instant){
  clearPageTimer();
  pageI=Math.max(0,Math.min(i,pages.length-1));
  typeTarget=pages[pageI]; typeI=instant?typeTarget.length:0;
  const el=$('d-msg');
  if(el){ el.textContent=instant?typeTarget:''; el.scrollTop=0; }
  renderMore();
  // A recalled page is not being typed, so nothing will fire the advance for it.
  if(instant) scheduleNextPage();
}

// Recalled messages render INSTANTLY. The typewriter belongs to a reply that is
// arriving now; replaying it while scrolling back through history makes an
// already-read message feel like it is being generated again.
function setMessage(m,instant){
  m=m||'';
  if(m===msgSource) return;
  clearPageTimer();
  msgSource=m; pages=splitPages(m);
  showPage(0,!!instant);
}
function stepType(){ if(typeI<typeTarget.length){ typeI+=2;
  const el=$('d-msg'); el.textContent=typeTarget.slice(0,typeI);
  // Keep the freshly typed tail visible in the rare case a measured page still
  // overruns by a hair; the CSS keeps overflow-y:auto as that safety net.
  el.scrollTop=el.scrollHeight;
  if(typeI>=typeTarget.length){ renderMore(); scheduleNextPage(); } } }

// A tap on the indicator skips ahead rather than waiting, for anyone who reads
// fast. It is an accelerator, not the mechanism: the pages arrive with or without
// it, and tapping simply cancels the pending timer and moves now.
$('d-more').addEventListener('click',e=>{ e.stopPropagation();
  if(pageI<pages.length-1) showPage(pageI+1); });

function repaginate(){
  if(!msgSource) return;
  // Count the characters already passed, ignoring whitespace so that a changed
  // wrap point cannot drift the position.
  const seen=pages.slice(0,pageI).join('').replace(/\s/g,'').length;
  const done=typeI>=typeTarget.length;
  pages=splitPages(msgSource);
  let n=0,target=0;
  for(let i=0;i<pages.length;i++){
    if(n>=seen+1){ break; }
    target=i; n+=pages[i].replace(/\s/g,'').length;
  }
  showPage(target,done);
}

let pollBusy=false;
async function poll(){
  // One request in flight at a time: at 400ms a slow response used to stack
  // polls up and apply them out of order, which reads as stutter.
  if(pollBusy) return; pollBusy=true;
  try{ const r=await fetch('/api/state',{cache:'no-store'});
    if(r.ok){ onState(await r.json()); }
  }catch(e){ showErr('state unavailable \u2014 is server.py running?'); }
  finally{ pollBusy=false; }
}

function loop(){ tick++; stepMovement(); stepBonus();
  if(blocking()||finishing) GameAudio.stopWalking(); else GameAudio.startWalking();
  if(tick%2===0) stepType(); render();
  if(sceneActive) drawScene(sceneActive); requestAnimationFrame(loop); }

// The board was previously sized once at load, so moving the window at the
// booth left it mis-sized until a reload.
// The chrome budget must be CONSTANT (or the board is re-fitted mid-turn and the
// page appears to slide downwards) but it must also be HONEST, or the board is
// sized too tall and its bottom edge is clipped off-screen. Caching one
// measurement taken at first fit was constant but dishonest: it read the bubble
// and the tray on the attract screen, and in play the tray fills with four
// location cards and grows. MEASURED on the clipped screenshot: wrap children
// came to bubble+tray+hud+stagebar+hud-meta plus five 7px gaps, against a magic
// "+58" that only approximated the last three.
// So: measure the parts that are genuinely static LIVE, and reserve the bubble's
// four-line CEILING rather than its current height. The bubble was the only
// thing that moved, so pinning its contribution makes the whole budget stable
// without understating anything.
const BUBBLE_MAX_LINES = 4;
// Reserve the bubble's worst-case height on the SLOT, by measuring it rather
// than calculating it. The bubble is briefly forced into its ceiling - four
// lines plus every optional child - read, and released. Called before the first
// fit and again on resize, because the rail's width decides where the text
// wraps and therefore what four lines costs.
function reserveBubbleSlot(){
  const slot=$('bubbleslot'), b=$('bubble'), msg=document.querySelector('#bubble .msg');
  if(!slot||!b||!msg) return 0;
  // A slot already holding a height would measure itself; clear it first.
  slot.style.height='';
  const had=msg.textContent;
  b.classList.add('measuring');
  // Text as well as height: an empty .msg with a forced height is right today,
  // but a line-box change would go unnoticed without real content in it.
  if(!had) msg.textContent='M';
  const h=b.offsetHeight;
  b.classList.remove('measuring');
  if(!had) msg.textContent='';
  slot.style.height=h+'px';
  return h;
}
function chromeBudget(){
  // The bubble's ceiling is no longer reconstructed from its parts - the slot IS
  // that ceiling, measured in reserveBubbleSlot(), so this just reads it. The
  // arithmetic that used to live here (subtract the message, add four lines
  // back, add an unconditional reserve for the page indicator) was correct and
  // fragile: every optional child had to be remembered in two places.
  const slot=$('bubbleslot');
  const bubbleMax=(slot && slot.offsetHeight) || reserveBubbleSlot();
  const h = id => { const e = $(id); return e && getComputedStyle(e).display !== 'none'
                                          ? e.offsetHeight : 0; };
  const gap = parseFloat(getComputedStyle($('wrap')).rowGap) || 7;
  return bubbleMax + h('tray') + h('hud') + h('stagebar') + h('hud-meta')
         + gap * 5 + 16;   // 16 = #wrap's own vertical padding
}
function fitCanvas(){
  const cv=$('cv'); if(!cv) return;
  // Re-measure the slot first: the rail's width decides where four lines wrap,
  // so the reservation is only valid for the width we are about to fit to.
  // Idempotent and cheap - one forced layout, no paint in between.
  reserveBubbleSlot();
  const chrome=chromeBudget()+(trayOpen?140:0);
  const w=Math.max(320,Math.min(innerWidth-24,1056,(innerHeight-chrome)*COLS/ROWS));
  cv.style.width=Math.round(w)+'px';
  cv.style.height=Math.round(w*ROWS/COLS)+'px';
  if($('ov-loc').classList.contains('pov')) sizePovCard();
  else syncSceneBuffer();
}

(async function init(){
  try{ CFG=await (await fetch('/api/config')).json(); }
  catch(e){ showErr('cannot load config.json'); return; }
  T=CFG.render.tile; S=CFG.render.scale; COLS=CFG.render.cols; ROWS=CFG.render.rows;
  const cv=$('cv'); cv.width=COLS*T*S; cv.height=ROWS*T*S;
  ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const sc=$('scene'); sc.width=COLS*T*S; sc.height=ROWS*T*S;
  sceneW=sc.width; sceneH=sc.height;
  sceneCtx=sc.getContext('2d'); sceneCtx.imageSmoothingEnabled=false;
  fitCanvas();
  // A resize changes the box width, so the wrap points move and the pages must
  // be recut. Re-cutting from scratch would throw the visitor back to page 1,
  // so land on whichever new page holds the text they were already reading.
  addEventListener('resize',()=>{ fitCanvas(); repaginate(); });
  document.documentElement.style.setProperty('--panel',CFG.theme.panel);
  document.documentElement.style.setProperty('--edge',CFG.theme.panel_edge);
  $('b-title').textContent=CFG.event.title;
  $('b-sub').textContent=CFG.event.subtitle.toUpperCase();
  // Unconditionally, not inside openTitle(): a visitor resuming mid-session
  // never sees the title card, and the handover and card panels would render
  // empty for them.
  paintScreenCopy();
  // Attribution, from config so a different operator can put their own name on
  // their own stand without touching the markup.
  const by=(CFG.event.byline||'').trim();
  $('b-by').textContent=by; $('b-by').style.display=by?'':'none';
  P.x=P.px=CFG.penguin.start[0]; P.y=P.py=CFG.penguin.start[1];
  buildMap(); await loadOptions(); await poll();
  if(!haveVisitor()) openTitle();
  setInterval(poll,CFG.server.poll_ms); loop();
})();
</script>
