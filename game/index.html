<script>
const $ = id => document.getElementById(id);
const showErr = m => { $('err').textContent = m || ''; };
const esc = s => String(s==null?'':s);

let CFG=null, ST={}, OPTS={}, T=16, S=3, COLS=22, ROWS=15, map=[], ctx=null, tick=0;
let nearId=null, panelOpen=false, panelLoc=null, visited=new Set();
// One-shot: the board is re-fitted the first time the chrome has real height.
let chromeSettled=false;
let histIdx=null;            // null = live; otherwise an index into the history
// CoCo's opening monologue over the house scene (line1, line2 and the summary
// "your data stays yours" beats) is not a server turn, so it is kept here and
// prepended to the turn history - letting the visitor scroll back to it from
// the map. Resets naturally on NEW VISITOR, which reloads the page.
let openingLog=[];
function logOpening(line){
  const s=String(line||'').trim(); if(!s) return;
  if(openingLog.length && openingLog[openingLog.length-1].reply===s) return;
  openingLog.push({reply:s, text:''});
}
let sel=new Set();
let nudgeMsg='', nudgeUntil=0, overNudged=false;
// A short-lived line in the bubble for things that are not a CoCo turn.
function nudge(m,ms){ nudgeMsg=m; nudgeUntil=Date.now()+(ms||3200); }
// A nudge can be dismissed with a tap on CoCo's bubble - used by the soft
// five-minute notice, which should never feel like it is holding the visitor.
addEventListener('DOMContentLoaded',()=>{
  const b=$('bubble'); if(b) b.addEventListener('click',()=>{ nudgeUntil=0; });
});

const GameAudio=(()=>{
  let ac=null,master=null,walking=false,windSrc=null,pulseTimer=null;
  let phraseNodes=[];  // only the CURRENT phrase's live nodes; pruned each loop
  const N=f=>440*Math.pow(2,(f-69)/12);
  function init(){
    if(ac) return ac;
    try{ ac=new AudioContext(); master=ac.createGain(); master.connect(ac.destination); }
    catch(e){ ac=null; } return ac;
  }
  function kill(n){ try{ n.stop?n.stop():n.disconnect(); }catch(e){} }
  function startWalking(){
    if(walking||!init()) return; walking=true;
    // Arctic wind bed with sweeping filter
    const buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.12;
    windSrc=ac.createBufferSource(); windSrc.buffer=buf; windSrc.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=350; lp.Q.value=0.7;
    const gw=ac.createGain(); gw.gain.setValueAtTime(0,ac.currentTime);
    gw.gain.linearRampToValueAtTime(0.09,ac.currentTime+0.3);
    windSrc.connect(lp).connect(gw).connect(master); windSrc.start();
    windSrc._gain=gw; windSrc._lp=lp;
    // Polar wanderer — pentatonic melody + triangle bass + heartbeat pulse, looping
    const dur=0.32;
    const melody=[
      67,69,72,null, 74,72,69,67,  64,null,67,69,  72,74,76,null,
      74,72,null,69, 67,64,null,60, 62,64,67,69,    72,null,74,72,
      69,67,64,null, 60,62,64,67,  69,null,72,74,   76,74,72,null,
      69,67,64,62,   60,null,64,67, 69,72,74,null,  72,69,67,64];
    const bass=[
      48,null,null,null, null,null,null,null, 45,null,null,null, null,null,null,null,
      43,null,null,null, null,null,null,null, 48,null,null,null, null,null,null,null,
      45,null,null,null, null,null,null,null, 43,null,null,null, null,null,null,null,
      48,null,null,null, null,null,null,null, 45,null,null,null, 48,null,null,null];
    const total=melody.length*dur, pulseInt=dur*4;
    function schedPhrase(){
      if(!walking) return;
      // Kill previous phrase's nodes before scheduling new ones
      phraseNodes.forEach(kill); phraseNodes=[];
      const t0=ac.currentTime+0.05;
      // Sweep wind filter
      lp.frequency.setValueAtTime(300,t0);
      lp.frequency.linearRampToValueAtTime(500,t0+total*0.5);
      lp.frequency.linearRampToValueAtTime(300,t0+total);
      // Pad drone
      [48,52,55].forEach(n=>{
        const osc=ac.createOscillator(),g=ac.createGain();
        osc.type='sine'; osc.frequency.value=N(n);
        g.gain.setValueAtTime(0,t0);
        g.gain.linearRampToValueAtTime(0.04,t0+1.5);
        g.gain.setValueAtTime(0.04,t0+total-1.5);
        g.gain.linearRampToValueAtTime(0,t0+total);
        osc.connect(g).connect(master); osc.start(t0); osc.stop(t0+total+0.1);
        phraseNodes.push(osc);
      });
      // Heartbeat pulse
      for(let i=0;i<Math.floor(total/pulseInt);i++){
        const osc=ac.createOscillator(),g=ac.createGain();
        osc.type='sine'; osc.frequency.value=N(36);
        const s=t0+i*pulseInt;
        g.gain.setValueAtTime(0.06,s);
        g.gain.exponentialRampToValueAtTime(0.001,s+pulseInt*0.7);
        osc.connect(g).connect(master); osc.start(s); osc.stop(s+pulseInt);
        phraseNodes.push(osc);
      }
      // Melody
      melody.forEach((n,i)=>{
        if(n===null) return;
        const osc=ac.createOscillator(),g=ac.createGain();
        osc.type='sine'; osc.frequency.value=N(n);
        const s=t0+i*dur;
        g.gain.setValueAtTime(0.065,s);
        g.gain.exponentialRampToValueAtTime(0.001,s+dur*2.2);
        osc.connect(g).connect(master); osc.start(s); osc.stop(s+dur*2.5);
        phraseNodes.push(osc);
      });
      // Bass
      bass.forEach((n,i)=>{
        if(n===null) return;
        const osc=ac.createOscillator(),g=ac.createGain();
        osc.type='triangle'; osc.frequency.value=N(n);
        const s=t0+i*dur;
        g.gain.setValueAtTime(0.07,s);
        g.gain.exponentialRampToValueAtTime(0.001,s+dur*6);
        osc.connect(g).connect(master); osc.start(s); osc.stop(s+dur*7);
        phraseNodes.push(osc);
      });
      pulseTimer=setTimeout(schedPhrase,total*1000-100);
    }
    schedPhrase();
  }
  function stopWalking(){
    if(!walking) return; walking=false;
    if(pulseTimer){ clearTimeout(pulseTimer); pulseTimer=null; }
    if(windSrc){
      try{ const g=windSrc._gain; g.gain.linearRampToValueAtTime(0,ac.currentTime+0.3);
        setTimeout(()=>{ kill(windSrc); windSrc=null; },350);
      }catch(e){ kill(windSrc); windSrc=null; }
    }
    phraseNodes.forEach(kill); phraseNodes=[];
  }
  function playLocationChime(){
    if(!init()) return; const t=ac.currentTime;
    [60,64,67,72].forEach((n,i)=>{
      const osc=ac.createOscillator(),g=ac.createGain();
      osc.type='sine'; osc.frequency.value=N(n);
      const s=t+i*0.12;
      g.gain.setValueAtTime(0.15,s);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.6);
      osc.connect(g).connect(master); osc.start(s); osc.stop(s+0.7);
    });
  }
  function playAchievement(){
    if(!init()) return; const t=ac.currentTime;
    [[60,64,67],[62,65,69],[64,67,72],[67,72,76]].forEach((ch,ci)=>{
      ch.forEach(n=>{
        const osc=ac.createOscillator(),g=ac.createGain();
        osc.type='sawtooth'; osc.frequency.value=N(n);
        const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200;
        const s=t+ci*0.4;
        g.gain.setValueAtTime(0.06,s); g.gain.setValueAtTime(0.06,s+0.3);
        g.gain.exponentialRampToValueAtTime(0.001,s+(ci===3?1.5:0.38));
        osc.connect(lp).connect(g).connect(master); osc.start(s); osc.stop(s+(ci===3?1.6:0.4));
      });
    });
  }
  function stopAll(){ stopWalking(); }
  return {startWalking,stopWalking,playLocationChime,playAchievement,stopAll};
})();

const rng = seed => { let s=seed>>>0; return () => (s=(s*1664525+1013904223)>>>0)/4294967296; };
const inb = (x,y) => x>=0 && y>=0 && x<COLS && y<ROWS;
const walkable = (x,y) => inb(x,y) && ![4,5,6,7].includes(map[y][x]);
const unlocked = id => (ST.unlocked||['library']).includes(id);
const haveVisitor = () => !!(ST.visitor && ST.visitor.first_name);

// 0 snow 1 snow_alt 2 ice 3 path 4 sea 5 pine 6 rock 7 structure
function buildMap(){
  const r=rng(CFG.render.seed); map=[];
  for(let y=0;y<ROWS;y++){ const row=[];
    for(let x=0;x<COLS;x++){
      if(y>=CFG.scenery.sea_from_row) row.push(4);
      else if(x===0||y===0||x===COLS-1) row.push(6);
      else { const n=r(); row.push(n<0.10?2:n<0.30?1:0); }
    } map.push(row);
  }
  CFG.scenery.pines.forEach(([x,y])=>{ if(inb(x,y)) map[y][x]=5; });
  CFG.scenery.rocks.forEach(([x,y])=>{ if(inb(x,y)) map[y][x]=6; });
  const ids=Object.keys(CFG.locations);
  for(let i=0;i<ids.length-1;i++) carve(CFG.locations[ids[i]].tile, CFG.locations[ids[i+1]].tile);
  carve(CFG.penguin.start, CFG.locations[ids[0]].tile);
  Object.values(CFG.locations).forEach(l=>{ const [x,y]=l.tile; if(inb(x,y)) map[y][x]=7; });
}
function carve(a,b){ let [x,y]=a;
  const soft=()=>{ if(inb(x,y)&&map[y][x]!==7&&map[y][x]!==4) map[y][x]=3; };
  while(x!==b[0]){ x+=Math.sign(b[0]-x); soft(); }
  while(y!==b[1]){ y+=Math.sign(b[1]-y); soft(); }
}

// ---------------- penguin ----------------
const P={ x:11,y:11,px:11,py:11,dir:'down',frame:0,moving:0,fromX:11,fromY:11 };
const keys={};
let reopenLock=0;
const blocking = () => panelOpen || $('ov-title').classList.contains('on')
  || $('ov-arctic').classList.contains('on')
  || $('ov-letter').classList.contains('on')
  || $('ov-home').classList.contains('on')
  || $('ov-ask').classList.contains('on')
  || $('ov-bonus').classList.contains('on')
  || $('ov-board').classList.contains('on')
  || $('ov-se').classList.contains('on')
  || $('ov-bp').classList.contains('on');
addEventListener('keydown',e=>{
  // Movement swallows w/a/s/d with preventDefault, so a focused field lost those
  // letters entirely: typing "paddy" produced "py". Any editable target gets the
  // key first, whatever else is going on. Escape still falls through to close.
  const t=e.target, tag=((t && t.tagName) || '').toLowerCase();
  if(e.key!=='Escape' && (tag==='input' || tag==='select' || tag==='textarea'
      || (t && t.isContentEditable))) return;
  if(blocking()){
    if(e.key==='Escape'){
      if($('ov-se').classList.contains('on')) $('se-go').click();
      else if($('ov-bonus').classList.contains('on')) skipBonus();
      else if(panelOpen) tryClosePanel(); else closeBp();
    }
    return;
  }
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=true; e.preventDefault(); }
  if((k==='e'||k==='enter')&&nearId) openPanel(nearId);
  if(k==='[') stepHist(-1);
  if(k===']') stepHist(1);
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

function wanted(){
  if(keys['w']||keys['arrowup'])    return [0,-1,'up'];
  if(keys['s']||keys['arrowdown'])  return [0, 1,'down'];
  if(keys['a']||keys['arrowleft'])  return [-1,0,'left'];
  if(keys['d']||keys['arrowright']) return [1, 0,'right'];
  return null;
}
function stepMovement(){
  if(P.moving>0){
    P.moving--; const t=1-P.moving/7;
    P.px=P.fromX+(P.x-P.fromX)*t; P.py=P.fromY+(P.y-P.fromY)*t;
    if(P.moving===0){ P.px=P.x; P.py=P.y; }
    return;
  }
  const w=wanted();
  if(w){
    const [dx,dy,dir]=w; P.dir=dir;
    const nx=P.x+dx, ny=P.y+dy;
    if(walkable(nx,ny)){ P.fromX=P.x; P.fromY=P.y; P.x=nx; P.y=ny; P.moving=7; P.frame++; }
  }
  let found=null;
  for(const [id,l] of Object.entries(CFG.locations)){
    if(Math.abs(l.tile[0]-P.x)<=1 && Math.abs(l.tile[1]-P.y)<=1) found=id;
  }
  if(found!==nearId){ nearId=found; paintHudJourney(); }
}

function drawPenguin(g,sx,sy){
  const c=CFG.penguin,u=S;
  const px=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(sx+x*u,sy+y*u,w*u,h*u); };
  const o=(P.moving>0&&P.frame%2)?1:0;
  const fs=P.moving>0?(P.frame%2?1:-1):0;
  // Transcribed cell-for-cell from the Cortex Code CLI, which stores CoCo as a
  // character grid - P body, B belly, O orange, E eye - only nine cells wide and
  // four rows tall:
  //     ..PEPEP..     eyes are the lower half of their cell
  //     .PPPOPPP.     the beak is ONE centred orange cell
  //     PPPBBBPPP     widest row; the belly is only three cells
  //     .PPOPPPOP     feet sit INSIDE the body - the sitting pose
  // A terminal cell is twice as tall as it is wide, so one cell is 2u x 4u here
  // and the silhouette keeps the CLI's 9:8 proportion. It steps 5 -> 7 -> 9 -> 7
  // cells wide, which is what makes it read as CoCo: earlier versions had a
  // square head on a 12-wide body and lost the taper entirely. The body is FLAT
  // #29B5E8 - the CLI has no darker flipper shading, so neither do we.
  // The one licensed change: the feet come out of row D and go BELOW the torso,
  // because feet set inside the body cannot read as walking - nothing moves
  // against the ground. Row D is therefore plain body, and the two orange cells
  // swing under it on alternate frames while the body bobs by `o` above them.
  px(4+fs,16,2,2,c.foot); px(12-fs,16,2,2,c.foot);
  px(4,0+o,10,4,c.body);                       // row A - head, 5 cells
  px(2,4+o,14,4,c.body);                       // row B - 7 cells
  px(0,8+o,18,4,c.body);                       // row C - 9 cells, the shoulders
  px(2,12+o,14,4,c.body);                      // row D - 7 cells
  if(P.dir==='up') return;                     // seen from behind: no face, no belly
  px(6,8+o,6,4,c.belly);                       // belly - three cells, row C only
  if(P.dir==='down'){
    px(6,2+o,2,2,c.eye); px(10,2+o,2,2,c.eye); // E = lower half of row A
    px(8,4+o,2,4,c.beak);                      // O = one centred cell, row B
  } else {
    const f=P.dir==='left'?-1:1;
    px(8+f*2,2+o,2,2,c.eye);                   // one eye in profile
    px(8+f*3,4+o,2,4,c.beak);                  // beak swung to the leading side
  }
}

function drawStructure(g,kind,tx,ty,done){
  const th=CFG.theme,u=S,X=tx*T*S,Y=ty*T*S,w=T*S;
  const r=(x,y,ww,hh,col)=>{ g.fillStyle=col; g.fillRect(X+x*u,Y+y*u,ww*u,hh*u); };
  if(kind==='library'){
    // Clear Dark yellow body, black peaked roof, two brand-blue windows, open book
    r(1,5,14,11,th.ansi_yellow_bright);   // body
    r(2,7,12,1,th.ansi_yellow);           // horizontal band
    g.fillStyle=th.ansi_black; g.beginPath();  // peaked roof
    g.moveTo(X-1*u,Y+6*u); g.lineTo(X+w/2,Y+0*u); g.lineTo(X+w+1*u,Y+6*u);
    g.closePath(); g.fill();
    r(3,8,4,4,th.accent); r(9,8,4,4,th.accent); // windows
    r(6,10,4,6,th.ansi_black);            // door
    // open book above the door
    g.fillStyle=th.ansi_white;
    g.beginPath(); g.moveTo(X+w/2,Y+3*u); g.lineTo(X+w/2-3*u,Y+5*u);
    g.lineTo(X+w/2,Y+4.5*u); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(X+w/2,Y+3*u); g.lineTo(X+w/2+3*u,Y+5*u);
    g.lineTo(X+w/2,Y+4.5*u); g.closePath(); g.fill();
    g.fillStyle=th.ansi_red; g.fillRect(X+w/2-0.5*u,Y+3*u,1*u,2*u); // spine
  } else if(kind==='marketplace'){
    r(1,7,14,2,th.warm_deep);
    r(2,9,2,7,th.ansi_black); r(12,9,2,7,th.ansi_black);
    for(let i=0;i<5;i++){
      g.fillStyle = i%2 ? th.ansi_red_bright : th.snow_bright;
      g.fillRect(X+(1+i*2.8)*u, Y+3*u, 2.8*u, 4*u);
    }
    r(1,2,14,1,th.warm_deep);
    r(4,5,2,2,th.accent_warm); r(8,5,2,2,th.accent);
    r(11,5,2,2,th.ansi_green_bright);
  } else if(kind==='workshop'){
    // modern tech lab: flat metal body, brand-blue LED strip, antenna/dish
    r(1,5,14,11,th.ansi_black);           // dark metallic body
    r(1,9,14,1,th.accent);                // LED strip
    r(2,6,12,3,th.ansi_black_bright);     // upper panel
    r(2,11,12,4,th.sea);                  // lower panel
    r(6,11,4,5,th.sea_deep);              // door
    // antenna + dish on top
    r(7,1,2,5,th.ansi_black_bright);      // mast
    g.fillStyle=th.ansi_blue_bright; g.beginPath();
    g.moveTo(X+6*u,Y+1*u); g.lineTo(X+10*u,Y+1*u);
    g.lineTo(X+8*u,Y-1*u); g.closePath(); g.fill(); // dish
    if(done){ r(5,10,6,1,th.accent); r(7,12,2,2,th.accent); }
  } else if(kind==='postbox'){
    r(6,6,4,10,th.ansi_black);
    r(3,1,10,7,th.ansi_red);
    r(4,2,8,2,th.ansi_white); r(5,5,6,1,th.sea_deep);
    if(!done) r(13,2,2,2,th.accent);
  }
}

function drawGround(g){
  const th=CFG.theme, cols=[th.snow,th.snow_alt,th.ice,th.path,th.sea];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=map[y][x];
    g.fillStyle = (t===5||t===7)?th.snow : (t===6?th.snow_alt : (cols[Math.min(t,4)]||th.snow));
    g.fillRect(x*T*S,y*T*S,T*S,T*S);
    if(t===4){ g.fillStyle=th.sea_deep;
      if((x+y+Math.floor(tick/18))%3===0) g.fillRect(x*T*S,y*T*S+6*S,T*S,2*S); }
    if(t===5){ const X=x*T*S,Y=y*T*S;
      g.fillStyle=th.rock; g.fillRect(X+7*S,Y+11*S,2*S,5*S);
      for(let i=0;i<3;i++){ g.fillStyle=i%2?th.pine_dark:th.pine; g.beginPath();
        g.moveTo(X+T*S/2,Y+(1+i*3.5)*S); g.lineTo(X+(14-i)*S,Y+(7+i*3.5)*S);
        g.lineTo(X+(2+i)*S,Y+(7+i*3.5)*S); g.closePath(); g.fill(); }
      g.fillStyle=th.snow_bright; g.fillRect(X+6*S,Y+4*S,4*S,S);
    }
    if(t===6){ const X=x*T*S,Y=y*T*S;
      g.fillStyle=th.rock; g.fillRect(X+3*S,Y+7*S,10*S,7*S);
      g.fillStyle=th.snow_bright; g.fillRect(X+3*S,Y+7*S,10*S,2*S); }
  }
}

function drawLabels(g){
  g.font=`bold ${9*S/2}px ui-monospace, monospace`; g.textAlign='center';
  Object.entries(CFG.locations).forEach(([id,l])=>{
    const [x,y]=l.tile, X=x*T*S+T*S/2, Y=y*T*S-4;
    const done=visited.has(id), open=unlocked(id), active=nearId===id;
    const txt=(done?'\u2713 ':(open?'':'\u2715 '))+l.name.toUpperCase();
    const wpx=g.measureText(txt).width+10;
    g.fillStyle='rgba(44,52,68,.88)'; g.fillRect(X-wpx/2,Y-13,wpx,15);
    g.fillStyle=active?'#ED8D30':done?'#29B5E8':open?'#DEE5EB':'#8FA6B8';
    g.fillText(txt,X,Y-2);
    if(active){
      const b=Math.sin(tick/8)*3;
      g.fillStyle=open?'#ED8D30':'#8FA6B8'; g.beginPath();
      g.moveTo(X,Y-18+b); g.lineTo(X-5,Y-26+b); g.lineTo(X+5,Y-26+b); g.closePath(); g.fill();
      const hint=open?'PRESS E':'NOT YET';
      g.font=`bold ${8*S/2}px ui-monospace, monospace`;
      const hw=g.measureText(hint).width+12;
      const HY=(y+1)*T*S+10;
      g.fillStyle=open?'rgba(237,141,48,.92)':'rgba(70,92,109,.92)';
      g.fillRect(X-hw/2,HY,hw,15);
      g.fillStyle='#191D27'; g.fillText(hint,X,HY+11);
      g.font=`bold ${9*S/2}px ui-monospace, monospace`;
    }
  });
  g.textAlign='left';
}

let flakes=[];
function drawSnowfall(g){
  if(!flakes.length){ const r=rng(99);
    for(let i=0;i<60;i++) flakes.push({x:r()*COLS*T*S,y:r()*ROWS*T*S,s:.4+r()*1.1,w:r()*2}); }
  g.fillStyle='rgba(255,255,255,.75)';
  flakes.forEach(f=>{ f.y+=f.s; f.x+=Math.sin((tick+f.w*40)/40)*.4;
    if(f.y>ROWS*T*S) f.y=-4; g.fillRect(f.x,f.y,S,S); });
}

function render(){
  // fitCanvas() first runs in init(), BEFORE the hud/tray/stagebar have any
  // content, so chromeBudget() is understated at that moment and the board is
  // sized too tall - MEASURED at 1440x900: budget 280 at init against 341 once
  // the chrome exists, giving a 620px board where 558px fits. Idle that is
  // invisible (the bubble sits below its four-line ceiling, so the slack
  // absorbs it), but any reply that reaches four lines pushed the board's
  // bottom edge 57px off-screen at 1280x800, 1440x900 and 1512x982 alike.
  // So re-fit ONCE, as soon as the chrome is real. This is not a mid-turn
  // re-fit: it happens before the visitor has a reply to read, and never again.
  if(!chromeSettled && $('hud') && $('hud').offsetHeight>0
     && $('tray') && $('tray').offsetHeight>0){
    chromeSettled=true; fitCanvas();
  }
  const g=ctx;
  g.fillStyle=CFG.theme.sky; g.fillRect(0,0,COLS*T*S,ROWS*T*S);
  drawGround(g);
  Object.entries(CFG.locations).forEach(([id,l])=>
    drawStructure(g,l.kind,l.tile[0],l.tile[1],visited.has(id)));
  drawPenguin(g,P.px*T*S,P.py*T*S);
  drawRoute(g);
  drawLabels(g);
  drawPostboxStatus(g);
  drawBonus(g);
  drawSparks(g);
  // Snow belongs outdoors. While the visitor is inside a location the board is
  // covered by #scene, so this only ever wasted frames - but gating it means
  // snow can never bleed into the library or the workshop, whatever changes
  // later to the scene canvas's opacity or size.
  if(!sceneActive) drawSnowfall(g);
}

// A gentle "go here next" cue: chevrons marching from the penguin toward the
// next unvisited location in the unlock order (Library -> Marketplace ->
// Workshop -> Postbox). Fades in only when the penguin is not already there.
function drawRoute(g){
  if(!haveVisitor()) return;
  const order=Object.keys(CFG.locations);
  const targetId=order.find(id=>!visited.has(id) && unlocked(id));
  if(!targetId || nearId===targetId) return;
  const tl=CFG.locations[targetId].tile;
  const px=P.px*T*S+T*S/2, py=P.py*T*S+T*S/2;
  const tx=tl[0]*T*S+T*S/2, ty=tl[1]*T*S+T*S/2;
  const dx=tx-px, dy=ty-py, len=Math.hypot(dx,dy);
  if(len<T*S*1.3) return;
  const ux=dx/len, uy=dy/len, ang=Math.atan2(uy,ux);
  // three chevrons that march toward the target
  const march=(tick/22)%1;
  const breath=0.58+0.16*Math.sin(tick/26);      // slow, not a flicker
  for(let i=0;i<2;i++){
    const d=T*S*1.1 + (i+march)*T*S*1.15;
    if(d>len-T*S*0.8) continue;
    const cx=px+ux*d, cy=py+uy*d;
    const a=breath-i*0.14;
    g.save(); g.translate(cx,cy); g.rotate(ang);
    g.strokeStyle=`rgba(237,141,48,${a})`; g.lineWidth=3*S/2;
    g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    g.moveTo(-4*S/2,-5*S/2); g.lineTo(4*S/2,0); g.lineTo(-4*S/2,5*S/2);
    g.stroke(); g.restore();
  }
}

// ---------------- POV interior scenes ----------------
// Drawn procedurally in the same pixel idiom as the map. Shown behind the
// library / marketplace panels and the wake-up screen so the interaction feels
// like it happens "at the desk", not in a floating box.
// ---- Real brand art, not pixel pastiche.
// The six-arm mark was hand-drawn three times and still read as a pinwheel,
// because the real thing is six THICK INWARD-POINTING chevrons around a rounded
// diamond with a hole in it - not a shape worth approximating at 60px. Load the
// actual files. They are ordinary static assets under /assets, served by the
// same handler as everything else.
const IMG={};
(function preload(){
  [['mark','/assets/snowflake-mark.png'],
   ['wordmark','/assets/snowflake-wordmark-white.png']].forEach(([k,src])=>{
    const im=new Image();
    im.onload=()=>{ IMG[k]=im; };
    im.onerror=()=>{ console.warn('[loco] asset missing:',src); };
    im.src=src;
  });
})();
// Both canvases run with imageSmoothingEnabled=false, which is right for the
// pixel art and wrong for a downscaled vector logo - unsmoothed it aliases into
// mush. Flip it for the one draw and put it back.
function drawImgSmooth(g,key,x,y,w,h){
  const im=IMG[key]; if(!im) return false;
  const was=g.imageSmoothingEnabled;
  g.imageSmoothingEnabled=true;
  g.drawImage(im,Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  g.imageSmoothingEnabled=was;
  return true;
}

// Rounded rectangle as a PATH (caller fills or strokes). Canvas has
// roundRect() now, but not on every browser a booth laptop might have.
function rrect(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r);
  g.closePath();
}

let sceneActive=null, sceneCtx=null, sceneW=0, sceneH=0;
// drawScene runs off the animation loop and has no access to server state, so
// the in-flight status is mirrored here once per poll.
let sceneThinking=false;
// THE SAFE BAND. The POV panel is an overlay above the scene canvas, so panel
// height eats art. Every interior draws its furniture line at SAFE and keeps all
// detail above it, so the strip the panel covers is deliberately plain surface.
let postT=0;                           // when the posting beat started
const POST_MS=2600;
//
// SAFE is MEASURED, not assumed. It began as a constant, which broke on a short
// viewport: the panel has a minimum usable height, so when the scene got small
// the panel grew past the line the scenes were protecting and covered CoCo. The
// panel wins that argument - options must be reachable - so the art yields to it
// instead, and the furniture line lands on the real panel top at any size.
const BAND=0.44;                       // the band we ASK for when there is room
let SAFE=1-BAND;                       // the band we actually GOT, per frame
function measureSafe(){
  const card=document.querySelector('#ov-loc.on.pov .card'), cv=$('cv');
  if(!card || !cv){ SAFE=1-BAND; return; }
  // BOTH heights must be CSS pixels. Measuring the card (CSS) against sceneH
  // (the backing store, 720 tall on a 2x display) under-reserved the band by the
  // device ratio, which is exactly how much of CoCo ended up behind the panel.
  const cr=cv.getBoundingClientRect(), cssH=cr.height;
  if(!cssH){ SAFE=1-BAND; return; }
  // Where the panel's TOP is, not how tall it is. The panel is anchored to the
  // viewport and may hang below the canvas, and height alone counted that
  // overhang as covered art - 68px of scene we were refusing to draw in for no
  // reason. The top edge is the only thing the art has to stay clear of.
  const ch=cssH-(card.getBoundingClientRect().top-cr.top);
  // The floor is low on purpose. On a cramped window the panel needs more room
  // than the band would give it, and the honest answer is to compress the scene
  // rather than to paint furniture where the panel will cover it.
  SAFE=Math.max(0.18,Math.min(0.80,1-ch/cssH));
}

function drawCoCoFront(g,cx,cy,u,opt){
  const c=CFG.penguin, o=opt||{};
  // Same CLI grid as drawPenguin (see there for the transcription): nine cells
  // wide, four rows tall, one cell 2 x 4.
  //
  // Two poses. `sitting` is the CLI EXACTLY - row D is `.PPOPPPOP`, with the two
  // orange cells set inside the body. That is the pose for the postcards and the
  // gallery, where CoCo is a portrait and nothing needs to move. The default
  // pose lifts those cells out of row D to below the torso, which is the one
  // licensed deviation, because feet inside the body cannot read as walking.
  //
  // Either pose puts the soles on cy+9u, so the ground plane that MOTIF_LIFT is
  // measured against does not shift when a card switches to sitting. Sitting is
  // 16 cells tall against walking's 18, so it is the crown that gives, not the
  // feet: walking keeps the crown at -7u, where drawThinkBubble anchors.
  const k=u*8/9, sit=!!o.sitting;
  const top = sit ? 9*u-16*k : -7*u;
  // bob and swing are in the MAP sprite's units, where one grid unit is half a
  // cell, so one unit is exactly k here - the animation values carry across from
  // drawPenguin unchanged. The body bobs; the feet stay planted, which is what
  // makes it read as a stride rather than a hop.
  const bob=(o.bob||0)*k, sw=(o.swing||0)*k;
  const r=(col,y,wc,hh,col2,dx)=>{ g.fillStyle=col2;
    g.fillRect(cx+(col*2-9)*k+(dx||0), cy+y, wc*2*k, hh); };
  if(!sit){                                                 // feet below, planted
    r(2,top+16*k,1,2*k,c.foot,sw); r(6,top+16*k,1,2*k,c.foot,-sw);
  }
  r(2,top+bob,       5,4*k,c.body);                         // row A - head
  r(1,top+4*k+bob,   7,4*k,c.body);                         // row B
  r(0,top+8*k+bob,   9,4*k,c.body);                         // row C - shoulders
  r(1,top+12*k+bob,  7,4*k,c.body);                         // row D
  if(sit){                                                  // row D as the CLI has it
    r(2,top+12*k+bob,1,4*k,c.foot); r(6,top+12*k+bob,1,4*k,c.foot);
  }
  r(3,top+8*k+bob,   3,4*k,c.belly);                        // belly, row C only
  r(3,top+2*k+bob,   1,2*k,c.eye); r(5,top+2*k+bob,1,2*k,c.eye);
  r(4,top+4*k+bob,   1,4*k,c.beak);                         // one centred cell
}
// A loading animation that belongs to the character rather than the chrome:
// "Processing your request..." was only ever text in the panel, so the scene sat
// frozen while CoCo appeared to do nothing. Drawn in the same pixel idiom.
function drawThinkBubble(g,cx,cy,u){
  // Classic thought bubble: the cloud sits UP AND TO THE SIDE, with puffs
  // trailing diagonally back to the crown of his head (drawCoCoFront's head top
  // is at cy-7u). Two earlier versions each got half of this right - one trailed
  // from the beak at the correct angle, the other from the head straight up like
  // a lollipop. Origin is the head, angle is the diagonal.
  const bw=13*u, bh=7*u;
  const ax=cx+3*u, ay=cy-7*u;                            // anchor: crown, off-centre
  const bx=ax+2.5*u, by=cy-20*u;                         // cloud, up and right
  g.fillStyle='rgba(25,29,39,.55)';                      // soft drop
  g.fillRect(bx-u,by+u,bw,bh);
  g.fillStyle='#E5EFF5'; g.fillRect(bx,by,bw,bh);        // cloud body
  g.fillRect(bx+2*u,by-u,bw-4*u,bh+2*u);
  // three puffs shrinking along the diagonal from the crown up to the cloud
  g.fillStyle='#DEE5EB';
  // Smallest puff at the crown, growing toward the cloud: the trail should
  // read as a thought expanding outward, not shrinking into his head.
  const puffs=[[0.30,1.1],[0.62,1.6],[0.86,2.2]];
  for(const [t,s] of puffs){
    const px=ax+(bx+2*u-ax)*t, py=ay+(by+bh-ay)*t;
    g.fillRect(px-s*u/2, py-s*u/2, s*u, s*u);
  }
  // three dots, one lit at a time, so it reads as working not stuck
  const lit=Math.floor(tick/9)%3;
  for(let i=0;i<3;i++){
    g.fillStyle = i===lit ? '#ED8D30' : '#8FA6B8';
    const d = i===lit ? 0.5*u : 0;
    g.fillRect(bx+2.5*u+i*3.2*u-d/2, by+2.5*u-d/2, 2*u+d, 2*u+d);
  }
}
function shelfBooks(g,x,y,w,u,seed){
  const r=rng(seed); let cx=x;
  const cols=['#B45648','#6D96B4','#C4AC62','#6CAA71','#BD7BCD','#DF6C5A','#67B5ED'];
  while(cx<x+w-u){ const bw=(1+Math.floor(r()*2))*u, bh=(6+Math.floor(r()*4))*u;
    g.fillStyle=cols[Math.floor(r()*cols.length)];
    g.fillRect(cx,y-bh,bw-1,bh); cx+=bw; }
}
function drawScene(kind){
  const g=sceneCtx, w=sceneW, h=sceneH, u=S, th=CFG.theme;
  measureSafe();                  // where the panel actually is, this frame
  if(kind==='house'){
    const p=openProg();
    const F=Math.sin(tick/7)*0.5+0.5;                 // fire flicker 0..1
    const FL=h*0.66;                                  // floor line
    // ---- walls: ice blocks with a lit top edge
    g.fillStyle='#2C3444'; g.fillRect(0,0,w,h);
    for(let by=0; by<FL; by+=h*0.105){
      for(let bx=0; bx<w; bx+=w*0.13){
        const alt=((bx/(w*0.13)|0)+(by/(h*0.105)|0))%2;
        g.fillStyle=alt?'#2C3444':'#35424C';
        g.fillRect(bx+2,by+2,w*0.13-4,h*0.105-4);
        g.fillStyle='rgba(255,255,255,.04)';
        g.fillRect(bx+2,by+2,w*0.13-4,3);
      }
    }
    // ---- floor, boards fanning toward the viewer
    g.fillStyle='#273D4C'; g.fillRect(0,FL,w,h-FL);
    for(let i=0;i<9;i++){
      g.fillStyle=i%2?'rgba(255,255,255,.03)':'rgba(0,0,0,.10)';
      const x0=w*(i/9), x1=w*0.5+(x0-w*0.5)*1.9;
      g.beginPath(); g.moveTo(x0,FL); g.lineTo(x1,h); g.lineTo(x1+w*0.06,h);
      g.lineTo(x0+w*0.055,FL); g.closePath(); g.fill();
    }
    g.fillStyle='#191D27'; g.fillRect(0,FL,w,4);
    // ---- window: night sky, moon, snow drifting past
    const wx=w*0.60, wy=h*0.09, ww=w*0.24, wh=h*0.26;
    g.fillStyle='#191D27'; g.fillRect(wx-5,wy-5,ww+10,wh+10);
    g.fillStyle='#273D4C'; g.fillRect(wx,wy,ww,wh);
    g.fillStyle='#E5EFF5'; g.fillRect(wx+ww*0.66,wy+wh*0.18,13,13);
    for(let i=0;i<16;i++){
      g.fillStyle='rgba(229,239,245,.55)';
      g.fillRect(wx+((i*37+tick*0.6)%ww),wy+((i*53+tick*1.4)%wh),S,S);
    }
    g.fillStyle='#465C6D';
    g.fillRect(wx+ww/2-2,wy,4,wh); g.fillRect(wx,wy+wh/2-2,ww,4);
    g.strokeStyle='#6D96B4'; g.lineWidth=4; g.strokeRect(wx,wy,ww,wh);
    // ---- fireplace: the room's light source
    const fx=w*0.80, fy=h*0.34, fw=w*0.15, fh=FL-fy;
    g.fillStyle='#35424C'; g.fillRect(fx-8,fy-10,fw+16,fh+10);
    g.fillStyle='#191D27'; g.fillRect(fx,fy,fw,fh);
    g.fillStyle='#35424C'; g.fillRect(fx+6,fy+fh-16,fw-12,10);
    g.fillStyle='#C4682A'; g.fillRect(fx+10,fy+fh-22,fw-20,8);
    for(let i=0;i<5;i++){
      const bh=(14+i*4)*(0.7+F*0.5), bx=fx+fw*0.18+i*(fw*0.16);
      g.fillStyle=i%2?'#ED8D30':'#E5C872';
      g.fillRect(bx,fy+fh-22-bh,fw*0.13,bh);
    }
    const fg=g.createRadialGradient(fx+fw/2,fy+fh*0.7,10,fx+fw/2,fy+fh*0.7,w*0.52);
    fg.addColorStop(0,'rgba(237,141,48,'+(0.30+F*0.12)+')');
    fg.addColorStop(1,'rgba(237,141,48,0)');
    g.fillStyle=fg; g.fillRect(0,0,w,h);
    // ---- shelf of jars above the hearth
    g.fillStyle='#C4682A'; g.fillRect(w*0.58,h*0.42,w*0.16,6);
    ['#6CAA71','#6D96B4','#C4AC62'].forEach((c,i)=>{ g.fillStyle=c;
      g.fillRect(w*0.59+i*(w*0.05),h*0.42-15,w*0.035,15); });
    // ---- Snowflake logo on the wall. The real mark, drawn from file.
    const sfx=w*0.375, sfy=h*0.155, sfr=h*0.075;
    drawImgSmooth(g,'mark',sfx-sfr,sfy-sfr,sfr*2,sfr*2);
    // ---- framed photo of the polar bear. The first version was a stack of
    // rectangles, which is fine for a 16px sprite and wrong for a photograph -
    // a bear is all curves. Ellipses and arcs, clipped to the frame.
    // Hung on the clear wall panel BETWEEN the logo and the window, and high
    // enough that its bottom edge (pfy+pfh) stays above the jar shelf at h*0.42.
    // It used to sit at w*0.625/h*0.275, which put it on top of the jars AND
    // over the bottom of the window - the frame was covering two things at once.
    const pfx=w*0.47, pfy=h*0.255, pfw=w*0.105, pfh=h*0.125;
    g.fillStyle='#C4682A'; g.fillRect(pfx-6,pfy-6,pfw+12,pfh+12);   // frame
    g.fillStyle='#C4682A'; g.fillRect(pfx-3,pfy-3,pfw+6,pfh+6);     // bevel
    const sky=g.createLinearGradient(0,pfy,0,pfy+pfh);
    sky.addColorStop(0,'#2C3444'); sky.addColorStop(1,'#6D96B4');
    g.fillStyle=sky; g.fillRect(pfx,pfy,pfw,pfh);
    g.save(); g.beginPath(); g.rect(pfx,pfy,pfw,pfh); g.clip();
    // snow bank he is sitting on
    g.fillStyle='#DEE5EB'; g.beginPath();
    g.ellipse(pfx+pfw*0.5,pfy+pfh*1.05,pfw*0.80,pfh*0.32,0,0,7); g.fill();
    const bcx=pfx+pfw*0.44, bby=pfy+pfh*0.82, bs=pfw*0.29;
    g.fillStyle='#E5EFF5';
    g.beginPath(); g.ellipse(bcx,bby-bs*0.60,bs*1.10,bs*0.82,0,0,7); g.fill();
    g.beginPath(); g.ellipse(bcx-bs*0.80,bby-bs*0.34,bs*0.46,bs*0.56,0,0,7);
    g.fill();                                                       // haunch
    g.beginPath(); g.ellipse(bcx+bs*0.62,bby-bs*1.40,bs*0.54,bs*0.47,0,0,7);
    g.fill();                                                       // head
    g.beginPath(); g.arc(bcx+bs*0.30,bby-bs*1.76,bs*0.17,0,7); g.fill();
    g.beginPath(); g.arc(bcx+bs*0.94,bby-bs*1.74,bs*0.17,0,7); g.fill();
    g.fillStyle='#E5EFF5';                                          // muzzle
    g.beginPath(); g.ellipse(bcx+bs*1.02,bby-bs*1.26,bs*0.26,bs*0.19,0,0,7);
    g.fill();
    g.fillStyle='#1E1E2E';                                          // nose, eye
    g.beginPath(); g.ellipse(bcx+bs*1.20,bby-bs*1.28,bs*0.12,bs*0.09,0,0,7);
    g.fill();
    g.beginPath(); g.arc(bcx+bs*0.64,bby-bs*1.50,bs*0.075,0,7); g.fill();
    // The scarf sat across the muzzle and read as a blue stripe on his face.
    // It belongs at the neck: lower, narrower, and tucked behind the head.
    g.fillStyle='#29B5E8';
    g.beginPath(); g.ellipse(bcx+bs*0.52,bby-bs*0.92,bs*0.34,bs*0.12,-0.30,0,7);
    g.fill();
    g.beginPath(); g.ellipse(bcx+bs*0.30,bby-bs*0.74,bs*0.11,bs*0.17,0.30,0,7);
    g.fill();                                                       // hanging end
    g.restore();
    // ---- rug
    g.fillStyle='#B45648'; g.beginPath();
    g.ellipse(w*0.62,h*0.80,w*0.20,h*0.070,0,0,7); g.fill();
    g.fillStyle='#B45648'; g.beginPath();
    g.ellipse(w*0.62,h*0.80,w*0.13,h*0.044,0,0,7); g.fill();
    // ---- the door: it swings open on 'leave' and CoCo walks out through it
    const dx=w*0.08, dw=w*0.17, dy=h*0.22, dh=FL-dy;
    g.fillStyle='#191D27'; g.fillRect(dx-7,dy-7,dw+14,dh+7);
    g.fillStyle='#465C6D'; g.fillRect(dx-7,dy-7,dw+14,7);
    const swing = openPhase==='leave' ? Math.min(1,p*1.6) : 0;
    if(swing>0){
      g.fillStyle='#2C3444'; g.fillRect(dx,dy,dw,dh);
      const sg=g.createLinearGradient(dx,dy,dx+dw,dy+dh);
      sg.addColorStop(0,'rgba(143,166,184,'+(0.30*swing)+')');
      sg.addColorStop(1,'rgba(143,166,184,0)');
      g.fillStyle=sg; g.fillRect(dx,dy,dw*1.5,dh);
      for(let i=0;i<10;i++){
        g.fillStyle='rgba(255,255,255,'+(0.5*swing)+')';
        g.fillRect(dx+((i*29+tick*1.1)%dw),dy+((i*41+tick*2.2)%dh),S,S);
      }
    }
    const pw=dw*(1-swing*0.82);
    g.fillStyle='#273D4C'; g.fillRect(dx,dy,pw,dh);
    g.fillStyle='#465C6D';
    g.fillRect(dx+3,dy+6,Math.max(0,pw-6),dh*0.42);

    E.forEach(e=>{ g.beginPath(); g.moveTo(V[e[0]][0],V[e[0]][1]);
      g.lineTo(V[e[1]][0],V[e[1]][1]); g.stroke(); });
    g.fillStyle='#84DDE0'; V.forEach(v=>g.fillRect(v[0]-2,v[1]-2,5,5));
    g.strokeStyle='rgba(132,221,224,.30)'; g.lineWidth=1;              // scan line
    const sl=oy-rh+((tick*1.6)%(rh*2));
    g.beginPath(); g.moveTo(ox-rw,sl); g.lineTo(ox+rw,sl); g.stroke();
    // ---- articulated arms dipping to the bench, throwing sparks
    [[w*0.26,-1],[w*0.74,1]].forEach((arm,i)=>{
      const ax=arm[0], dip=Math.sin(tick/17+i*2.1);
      const j1x=ax, j1y=BN*0.14, j2x=ax+arm[1]*w*0.055, j2y=BN*0.48+dip*h*0.03;
      const tipx=ax+arm[1]*w*0.015, tipy=BN-h*0.045+dip*h*0.018;
      g.strokeStyle='#465C6D'; g.lineWidth=9;
      g.beginPath(); g.moveTo(j1x,j1y); g.lineTo(j2x,j2y);
      g.lineTo(tipx,tipy); g.stroke();
      g.strokeStyle='#8FA6B8'; g.lineWidth=3;
      g.beginPath(); g.moveTo(j1x,j1y); g.lineTo(j2x,j2y);
      g.lineTo(tipx,tipy); g.stroke();
      g.fillStyle='#465C6D'; g.fillRect(j1x-8,j1y-8,16,16);
      g.fillRect(j2x-6,j2y-6,12,12);
      g.fillStyle='#ED8D30'; g.fillRect(tipx-4,tipy-4,8,8);
      if(dip>0.55){                                                    // sparks
        for(let k2=0;k2<7;k2++){
          const t2=(tick*2+k2*9)%18;
          g.fillStyle='rgba(229,200,114,'+(1-t2/18)+')';
          g.fillRect(tipx+(k2-3)*3.5, tipy+t2*1.5, S, S);
        }
        g.fillStyle='rgba(229,200,114,.18)';
        g.beginPath(); g.arc(tipx,tipy,20,0,7); g.fill();
      }
    });
    // ---- CoCo at the bench, lit from below by the hologram
    drawCoCoFront(g,w*0.5,BN-h*0.055,S*1.9);
    if(sceneThinking){
      // --- FORGING: CoCo alternates between welding and hammering ---
      // Two jobs, not one. Previously the mask and the hammer ran together,
      // which is why the visor looked like a stuck-on black bar - nobody wears a
      // welding mask to swing a hammer. Now it is a cycle: ~3.3s welding, then
      // ~3.3s hammering, mask up.
      const cu=S*1.9, ccx=w*0.5, ccy=BN-h*0.055;
      // The anvil used to sit at w*0.62 while CoCo stood at w*0.5, which on a
      // wide scene is most of a metre away - so the hammer and the torch read as
      // floating tools operating themselves. It is now within a flipper's reach,
      // and both tools are drawn with an arm holding them.
      // MEASURED IN CHROMIUM: at ccx+cu*2.8 the shoulder sits INSIDE the body
      // (the mask is cu*7.6 wide, so the silhouette is +/-cu*3.8) and ccy-cu*3.4
      // is exactly eye height - so the arm ROOT was painting over CoCo's right
      // eye on every frame. The hammer itself never touched the face; the arm
      // did. Rooted outboard of the silhouette and below the eye line instead.
      const shx=ccx+cu*4.2, shy=ccy-cu*2.0;
      // The anvil is placed WHERE THE HAMMER LANDS rather than at a guessed
      // offset. The hammer is a rigid tool rotating about the flipper's grip, so
      // its reach is fixed geometry - deriving the anvil from it is what makes
      // the head meet the workpiece instead of stopping short of it or driving
      // through it. HGRIP/HSHAFT/HSTRUCK are shared with the hammering branch.
      const HGX=shx+cu*2.6, HGY=shy+cu*1.6;      // the grip, and the pivot
      const HSHAFT=cu*7.2;                        // grip to head centre
      // Struck angle kept shallow: the bench line BN is only ~cu*4.6 below
      // CoCo, so a steeper downswing drives the anvil through the bench.
      const HRAISED=-1.08, HSTRUCK=0.30;          // radians: up, and down
      const ax2=HGX+Math.cos(HSTRUCK)*HSHAFT+cu*0.6,
            ay2=HGY+Math.sin(HSTRUCK)*HSHAFT+cu*1.7+12;
      const flip=(gx,gy)=>{                      // one flipper, shoulder to grip
        // In CoCo's own blue, brightened. Drawn in #1F4258 it was the same value
        // as the wall shading and read as a shadow, not a limb.
        g.strokeStyle='#6D96B4'; g.lineWidth=cu*1.8; g.lineCap='round';
        g.beginPath(); g.moveTo(shx,shy); g.lineTo(gx,gy); g.stroke();
        g.strokeStyle='#67B5ED'; g.lineWidth=cu*0.7;
        g.beginPath(); g.moveTo(shx,shy-cu*0.45); g.lineTo(gx,gy-cu*0.45); g.stroke();
        // A visible grip at the end, so the arm plainly CLASPS the tool rather
        // than stopping near it.
        g.fillStyle='#35424C';
        g.fillRect(gx-cu*1.0,gy-cu*0.9,cu*2.0,cu*1.8);
      };
      const WELD = Math.floor(tick/200)%2===0;
      // MEASURED: drawn after the tools, the bubble covered ~60% of the raised
      // hammer head (head clamped to the bubble's bottom edge, pixel count
      // halved). It is CoCo's thought - the tool he is swinging belongs in front
      // of it, so it goes down first.
      drawThinkBubble(g,w*0.5,BN-h*0.055,S*1.9);

      // ---- the anvil is furniture: it stays for both jobs.
      g.fillStyle='#465C6D'; g.fillRect(ax2-18,ay2-8,36,8);   // face
      g.fillStyle='#465C6D'; g.fillRect(ax2-14,ay2-10,28,2);  // lit top edge
      g.fillStyle='#35424C'; g.fillRect(ax2-10,ay2,20,14);    // waist
      g.fillStyle='#222834'; g.fillRect(ax2-16,ay2+14,32,4);  // base
      // the workpiece, glowing on the face
      g.fillStyle='rgba(237,141,48,.35)'; g.fillRect(ax2-13,ay2-15,26,10);
      g.fillStyle='#ED8D30'; g.fillRect(ax2-8,ay2-12,16,4);
      g.fillStyle='#E5C872'; g.fillRect(ax2-6,ay2-12,12,2);

      if(WELD){
        // ---- the mask. A proper helmet: a rounded grey shell over the whole
        // head with a wide cyan window, not a black letterbox across the eyes.
        // Narrower than the first attempt, which overhung the left shoulder
        // and pushed a grey tab out past the right - a mask worn crooked. The
        // shell now sits inside CoCo's silhouette.
        const mw=cu*7.6, mh=cu*7.2, mx0=ccx-mw/2, my0=ccy-cu*9.7;
        g.fillStyle='#465C6D';                       // shell, shadowed side
        rrect(g,mx0,my0,mw,mh,cu*2.2); g.fill();
        g.fillStyle='#8FA6B8';                       // shell, lit
        rrect(g,mx0+cu*0.5,my0+cu*0.4,mw-cu*1.6,mh-cu*1.6,cu*1.9); g.fill();
        g.fillStyle='#DEE5EB';                       // top highlight
        rrect(g,mx0+cu*1.6,my0+cu*0.6,mw-cu*3.4,cu*1.0,cu*0.5); g.fill();
        // the window: dark bezel, cyan glass, two diagonal light streaks
        const ww=mw-cu*2.2, wh=cu*2.6, wx=ccx-ww/2, wy=my0+cu*2.4;
        g.fillStyle='#35424C'; rrect(g,wx-cu*0.4,wy-cu*0.4,ww+cu*0.8,wh+cu*0.8,cu*0.5); g.fill();
        g.fillStyle='#29B5E8'; g.fillRect(wx,wy,ww,wh);
        g.fillStyle='#84DDE0'; g.fillRect(wx,wy,ww,cu*0.5);
        g.save(); g.beginPath(); g.rect(wx,wy,ww,wh); g.clip();
        g.fillStyle='rgba(255,255,255,.30)';
        g.translate(wx,wy); g.rotate(-0.5);
        g.fillRect(ww*0.18,-wh,cu*0.9,wh*3);
        g.fillRect(ww*0.52,-wh,cu*0.45,wh*3);
        g.restore();

        // ---- the arc. A hard white core that flickers, a coloured halo, and a
        // spray of sparks falling AWAY from the work - the giveaway that it is
        // welding and not just a glow.
        const fl=0.55+0.45*Math.abs(Math.sin(tick*0.9))*(tick%7<5?1:0.35);
        g.fillStyle='rgba(103,181,237,'+(0.16*fl).toFixed(3)+')';
        g.beginPath(); g.arc(ax2,ay2-12,cu*7*fl,0,7); g.fill();
        g.fillStyle='rgba(103,181,237,'+(0.60*fl).toFixed(3)+')';
        g.beginPath(); g.arc(ax2,ay2-12,cu*2.6*fl,0,7); g.fill();
        g.fillStyle='#E5EFF5';
        g.fillRect(ax2-cu*0.8,ay2-13-cu*0.5,cu*1.6,cu*1.4);
        // The torch, HELD - angled from CoCo's flipper down onto the work.
        // The first version was a horizontal dark bar on a dark wall: all that
        // was visible of it was the red nozzle, floating by his chest.
        const gx=shx+cu*1.8, gy=shy+cu*1.2;          // where the flipper grips
        flip(gx,gy);
        g.save(); g.translate(gx,gy);
        g.rotate(Math.atan2((ay2-15)-gy,ax2-gx));
        const tl=Math.hypot(ax2-gx,(ay2-15)-gy);
        g.fillStyle='#8FA6B8'; g.fillRect(0,-cu*0.6,tl*0.72,cu*1.2);  // body
        g.fillStyle='#DEE5EB'; g.fillRect(0,-cu*0.6,tl*0.72,cu*0.4);  // lit edge
        g.fillStyle='#465C6D'; g.fillRect(tl*0.72,-cu*0.4,tl*0.20,cu*0.8);
        g.fillStyle='#B45648'; g.fillRect(tl*0.92,-cu*0.5,tl*0.08,cu*1.0);
        g.restore();
        for(let sp=0;sp<10;sp++){
          const t2=(tick*2.2+sp*13)%26;
          const spx=ax2+Math.cos(sp*1.9)*t2*0.8, spy=ay2-12+t2*0.75;
          if(spy>ay2+16) continue;
          g.fillStyle=sp%3?'#E5C872':'#67B5ED';
          g.fillRect(spx,spy,S*1.3,S*1.3);
        }
      } else {
        // ---- hammering. CoCo HOLDS the hammer: it is drawn as one rigid
        // tool rotating about the point his flipper grips, so the grip, the
        // shaft and the head can never drift apart.
        //
        // THE BUG THIS REPLACES: the shaft was drawn as a fixed vertical bar in
        // PIXEL offsets (handle 34px above the head) while CoCo's body is placed
        // in fractions of h. On a short scene h collapses but 34px does not, so
        // the raised shaft climbed straight through his face. Everything here is
        // in cu units, which scale with the sprite, so the geometry holds at any
        // scene height.
        const ph=Math.sin(tick/6);                   // -1 raised, +1 struck
        const strikeY=ay2-12;                        // top of the workpiece
        // The grip: just beyond the shoulder, on the anvil side. The arm reaches
        // here and the tool pivots here, so the two are locked together.
        const gx2=HGX, gy2=HGY;
        // Raised at -62 degrees, struck at +30. The arc is deliberately kept on
        // the anvil side of the grip so no part of the swing crosses the head.
        const ang=HRAISED+(ph+1)/2*(HSTRUCK-HRAISED);
        const SHAFT=HSHAFT;                          // grip to head centre
        g.save();
        g.translate(gx2,gy2); g.rotate(ang);
        // shaft runs along +x from the grip, head sits at the far end
        g.fillStyle='#C4682A'; g.fillRect(0,-cu*0.45,SHAFT,cu*0.9);
        g.fillStyle='#C4682A'; g.fillRect(0,-cu*0.45,SHAFT,cu*0.3);
        g.fillStyle='#8FA6B8'; g.fillRect(SHAFT-cu*0.6,-cu*1.7,cu*2.4,cu*3.4);
        g.fillStyle='#8FA6B8'; g.fillRect(SHAFT-cu*0.6,-cu*1.7,cu*2.4,cu*0.6);
        g.fillStyle='#465C6D'; g.fillRect(SHAFT+cu*1.8,-cu*1.1,cu*0.7,cu*2.2);
        g.restore();
        // The arm last, so the grip reads as closing over the shaft.
        flip(gx2,gy2);
        if(ph>0.90){
          // The burst used to be nine long-lived sparks plus a fat translucent
          // disc, which at the first frame of the phase piled up over the hammer
          // and read as a brown smear. Short-lived, sparser, and drawn tight to
          // the face so the hammer stays legible through it.
          for(let sp=0;sp<6;sp++){
            const ang2=sp*0.62-1.85, spd=(tick*2.4+sp*11)%13;
            // Thrown outwards and DOWNWARDS from the contact line. Sparks
            // rising into the head's lower edge is what made the strike frame
            // muddy: hot pixels and grey block occupying the same rows.
            const spx=ax2+Math.cos(ang2)*spd*1.6,
                  spy=strikeY+cu*0.8+Math.abs(Math.sin(ang2))*spd*0.5;
            g.fillStyle=sp%2?'#E5C872':'#ED8D30';
            g.fillRect(spx,spy,S*1.2,S*1.2);
          }
          g.fillStyle='rgba(229,200,114,.22)';
          g.beginPath(); g.arc(ax2,strikeY+cu*0.6,cu*1.5,0,7); g.fill();
        }
      }
    }
    g.fillStyle='rgba(41,181,232,.16)';
    g.fillRect(w*0.5-38,BN-h*0.16,76,h*0.16);
    // ---- steel bench: the panel docks against this edge
    g.fillStyle='#35424C'; g.fillRect(0,BN,w,h-BN);
    g.fillStyle='#465C6D'; g.fillRect(0,BN,w,5);
    g.fillStyle='rgba(41,181,232,.35)'; g.fillRect(0,BN+5,w,2);
    for(let x=w*0.05;x<w*0.95;x+=w*0.09){                              // bolts
      g.fillStyle='#222834'; g.fillRect(x,BN+12,7,7);
    }
    for(let i=0;i<5;i++){                                              // seams
      g.fillStyle='rgba(0,0,0,.16)';
      g.fillRect(0,BN+26+i*Math.max(8,(h-BN)/6),w,2);
    }
    g.fillStyle='rgba(41,181,232,.07)';                                // spill
    g.fillRect(w*0.30,BN+5,w*0.40,h-BN);
    // ---- vignette
    const vg2=g.createRadialGradient(w/2,h*0.40,h*0.30,w/2,h*0.40,h*0.98);
    vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(0,0,0,.62)');
    g.fillStyle=vg2; g.fillRect(0,0,w,h);
    return;
  }
  if(kind==='postbox'){
    const p=Math.max(0,Math.min(1,(Date.now()-postT)/POST_MS));
    const GR=h*SAFE;
    g.fillStyle=th.sky; g.fillRect(0,0,w,h);
    // arctic dusk behind: a soft horizon and a few pines
    const sg=g.createLinearGradient(0,0,0,GR);
    sg.addColorStop(0,'#273D4C'); sg.addColorStop(1,'#465C6D');
    g.fillStyle=sg; g.fillRect(0,0,w,GR);
    for(let i=0;i<7;i++){
      const tx=w*(0.05+i*0.15), th2=h*0.10;
      g.fillStyle='#273D4C';
      g.beginPath(); g.moveTo(tx,GR-th2*1.6); g.lineTo(tx-w*0.030,GR);
      g.lineTo(tx+w*0.030,GR); g.closePath(); g.fill();
    }
    g.fillStyle=th.snow; g.fillRect(0,GR,w,h-GR);
    g.fillStyle='rgba(41,181,232,.10)'; g.fillRect(0,GR,w,4);
    // the postbox
    const bx=w*0.62, by=GR-h*0.26, bw=w*0.11, bh=h*0.26;
    g.fillStyle='#35424C'; g.fillRect(bx+bw*0.36,by+bh*0.55,bw*0.28,bh*0.45);
    g.fillStyle='#B45648'; g.fillRect(bx,by,bw,bh*0.60);
    g.fillStyle='#B45648'; g.fillRect(bx,by,bw,6);
    // The envelope, the hole and the red lip all have to agree. Previously the
    // hole was a fixed fraction of the box and the letter was a fraction of the
    // stage, so the letter came out WIDER than the lip; and the lip was painted
    // last, so the letter sank behind it. Now the hole is sized from the letter
    // it has to swallow, and the letter is drawn ON TOP of the lip going in.
    const slotX=bx+bw*0.5, slotY=by+bh*0.22;
    const ew=w*0.075, eh=h*0.052;
    const holeW=Math.max(bw*0.64, ew+w*0.014);       // never narrower than the letter
    const holeH=Math.max(9,eh*0.30);
    const holeX=slotX-holeW/2;
    g.fillStyle='#191D27'; g.fillRect(holeX,slotY,holeW,holeH);          // the hole
    if(p>0.60){                                                          // the lip
      g.fillStyle='#B45648';
      g.fillRect(holeX,slotY-(p<0.72?4:0),holeW,7);
    }
    if(p<0.62){
      const t=p/0.62;
      const ex_start=w*0.30, ex_end=slotX-ew/2;
      const ex=ex_start+(ex_end-ex_start)*t;
      const ey_start=GR-h*0.22, ey_end=slotY-eh/2;
      const ey=ey_start+(ey_end-ey_start)*t - Math.sin(t*Math.PI)*h*0.13;
      g.save(); g.translate(ex+ew/2,ey+eh/2); g.rotate(-0.5+t*0.5);
      g.fillStyle='#EADFC6'; g.fillRect(-ew/2,-eh/2,ew,eh);
      g.strokeStyle='#C4AC62'; g.lineWidth=2; g.strokeRect(-ew/2,-eh/2,ew,eh);
      g.beginPath(); g.moveTo(-ew/2,-eh/2); g.lineTo(0,eh*0.1);
      g.lineTo(ew/2,-eh/2); g.stroke(); g.restore();
    } else if(p<0.78){
      const t=(p-0.62)/0.16;                         // sinking into the slot
      g.fillStyle='#EADFC6';
      g.fillRect(slotX-ew/2,slotY-eh*(1-t),ew,eh*(1-t));
    }
    if(p>0.74){
      for(let i=0;i<9;i++){
        const t=(p-0.74)/0.26, a=1-t;
        const ang=i*0.7, r=t*h*0.12;
        g.fillStyle=`rgba(229,200,114,${Math.max(0,a)})`;
        g.fillRect(slotX+Math.cos(ang)*r,slotY+Math.sin(ang)*r-h*0.02,S,S);
      }
    }
    // CoCo, having posted it, with a flipper still raised
    const cx=w*0.44, cy=GR-h*0.045;
    drawCoCoFront(g,cx,cy,S*1.9);
    if(p>0.62){
      // Flat body, as in the CLI - so the raised flipper reads by silhouette,
      // sticking out past the shoulder line, not by being a darker blue.
      g.fillStyle=CFG.penguin.body;
      g.fillRect(cx+S*1.9*4,cy-S*1.9*6,S*1.9*2,S*1.9*4);
    }
    for(let i=0;i<26;i++){                            // snow
      const sx=(i*89+Math.sin((tick+i*11)/38)*8)%w, sy=(i*67+tick*1.2)%h;
      g.fillStyle='rgba(255,255,255,.6)'; g.fillRect(sx,sy,S,S);
    }
    return;
  }
}
function openScene(kind){ sceneActive=kind; $('scene').classList.add('on'); }
function closeScene(){
  sceneActive=null; $('scene').classList.remove('on');
  // sizePovCard() reshapes the shared canvas into a letterbox for the interior.
  // Nothing put it back, so the MAP inherited the interior's aspect and arrived
  // squashed. Only the interiors were meant to change shape.
  $('ov-loc').classList.remove('pov');
  $('wrap').classList.remove('povfocus');
  fitCanvas();
}
// Tie the POV desk panel to the scene: same width as the canvas, and capped so
// the interior shows in the top half above it.
function sizePovCard(){
  const cv=$('cv'), card=document.querySelector('#ov-loc .card');
  if(!cv || !card) return;
  // WIDE AND SHORT, AND THE WIDTH COMES FIRST. Three earlier versions solved
  // for HEIGHT and then derived width from the board's 22:15 aspect, which is
  // why the interior kept coming out as a tall narrow box with a column of dead
  // sky in it and margins either side. The interiors are rooms seen head-on:
  // they want to be letterboxes. So width is now taken first - the whole stage,
  // less a margin - and the height is a fraction of it. The scene loses the
  // empty top of the room, which is exactly the crop that was asked for, and
  // the panel below inherits the same full width.
  //
  // Nothing in the art needs touching: every interior draws from (w,h) in
  // proportion, syncSceneBuffer() reshapes the pixel buffer to match this box
  // so the pixels stay square, and measureSafe() reads the panel's live top
  // edge each frame and keeps the furniture line under it.
  // The LIBRARY panel carries two questions - what data you hold, AND the
  // platform chips for where it sits today - so it needs more room than the
  // other stops or the second question lands below the fold and gets missed.
  // That chip answer is what drives the ingestion route in the blueprint, so a
  // visitor scrolling past it costs the most useful section of the document.
  const PAD=10, LAP=26, MAXW=1320;
  const TWO_Q = panelLoc==='library';
  // The workshop is the busiest room - racks floor to ceiling, a tool rack, a
  // hologram and a robot arm - so the flat 0.42 crop squashed it while the
  // emptier rooms were fine. It gets a little more height back.
  const TALL = panelLoc==='workshop';
  const WIDE = TWO_Q ? 0.36 : TALL ? 0.47 : 0.42;   // shorter room, taller panel
  const PANEL_MIN = TWO_Q ? 460 : 340;
  const ov=$('ov-loc');
  // Measured from where the canvas actually starts, not from the top of the
  // window - the HUD sits above it, and assuming otherwise once put the panel
  // 250px too high and buried a third of the interior.
  const cvTop=cv.getBoundingClientRect().top;
  const top0=cvTop-ov.getBoundingClientRect().top;
  const total=Math.max(320,innerHeight-cvTop-PAD);
  const boxW=Math.min(innerWidth-PAD*2,MAXW);
  // The scene is the SHORTER of its natural letterbox (boxW*WIDE) and two-fifths
  // of the available height, so the text box below always gets about three-
  // fifths. Feedback: the interiors were too tall and the reply box forced a
  // scroll. Each room is drawn proportionally to this height, so a shorter band
  // just crops it - which is why the per-room art was thinned to suit.
  let sceneH=Math.round(Math.min(boxW*WIDE, total*(TALL?0.45:0.40)));
  // The panel takes whatever is left, never less than its floor; if the column
  // then overflows, the SCENE gives the height up, never the panel - a panel
  // whose CONFIRM has scrolled out of sight is a dead end, a shorter room is
  // just a tighter crop.
  let panelH=Math.max(PANEL_MIN,total-sceneH+LAP);
  if(sceneH+panelH-LAP>total) sceneH=Math.max(190,total-panelH+LAP);
  cv.style.width=boxW+'px';
  cv.style.height=sceneH+'px';
  card.style.width=boxW+'px';
  card.style.maxWidth='none';               // .card caps at min(700px,94vw)
  card.style.maxHeight=panelH+'px';
  card.style.marginTop=Math.max(0,top0+sceneH-LAP)+'px';
  syncSceneBuffer();
}

// The scene canvas is `position:absolute; inset:0; width:100%; height:100%`, so
// it is stretched to whatever box the board is in. Leaving its pixel buffer at
// the board's 22:15 while the box became a 1:0.42 letterbox would squash every
// pixel by a third - the art would not be cropped, it would be crushed. Reshape
// the buffer to the box instead: width fixed, height derived, pixels square.
function syncSceneBuffer(){
  const sc=$('scene'), cv=$('cv'); if(!sc || !cv) return;
  const bw=parseFloat(cv.style.width)||COLS*T*S,
        bh=parseFloat(cv.style.height)||ROWS*T*S;
  // NO FLOOR ON H. MEASURED in Chromium at 1512x800: a 300px floor while the box
  // was 288px tall gave a buffer ratio of 0.284 against a CSS ratio of 0.218, so
  // every interior was stretched ~30% vertically - the exact "aspect ratio is
  // wrong" symptom. The floor was protecting against a degenerate 0-height
  // buffer; guard that directly instead and let the ratio hold.
  const W=COLS*T*S, H=Math.max(8,Math.round(W*bh/bw));
  if(sc.width===W && sc.height===H) return;
  sc.width=W; sc.height=H; sceneW=W; sceneH=H;
  // Resizing a canvas resets its context state, including the smoothing flag -
  // and a smoothed pixel scene is a blurry scene.
  sceneCtx=sc.getContext('2d'); sceneCtx.imageSmoothingEnabled=false;
}

// ---------------- opening title + the letter ----------------
// Convert *phrases* wrapped in asterisks into shimmering spans. Content is our
// own config copy, so escaping first keeps it safe.
function sparkle(s){ return esc(s).replace(/\*([^*]+)\*/g,'<span class="spark">$1</span>'); }
// Prose that belongs to a screen rather than a stop. It used to live in the
// markup, which kept it out of the decision tree's "every scripted line"
// section and out of reach of review.
function paintScreenCopy(){

// A ONE-WAY LATCH on the title card. It is not enough to gate on server state:
// both guards below (haveVisitor(), firstLoad) read fields off ST, so a single
// failed or partial /api/state poll mid-visit - visitor object missing,
// updated_at absent - satisfied them and the title card reappeared OVER a live
// game. Seen at the postbox on 5/4. Once this browser has started a visit the
// card must never return, whatever the server says, so it latches on START and
// on the first sight of a real stage and is only ever cleared by a reload.
let titleDone=false;
function openTitle(){
  if(titleDone) return;
  const t=(CFG.intro)||{};
  $('t-title').textContent=t.title||'Loco for CoCo';
  // Asterisked phrases become a flat highlight, so the privacy promise reads
  // as a fact rather than a banner. Escaped first, so config copy stays safe.
